<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0c12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="아이언 독스">
<meta name="format-detection" content="telephone=no">
<script>window.__PWA__=true;</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>아이언 독스</title>
<style>
:root { --bg: #0b0c12; --panel: #161925; --panel2: #1f2333; --line: #2e3448; --txt: #e6e8f0; --dim: #8d93a8; --acc: #ffcc33; --good: #6fdc6f; --bad: #ff6b5b; --blue: #6fa8ff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); overflow: hidden; touch-action: none;
  font-family: "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
html, body { overscroll-behavior: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
* { -webkit-touch-callout: none; }
#app { position: fixed; inset: 0; }
#rotate { position: fixed; inset: 0; z-index: 100; background: #0b0c12; display: none; align-items: center; justify-content: center; text-align: center; font-size: 18px; color: var(--txt); }
#rotate .ph { font-size: 48px; margin-bottom: 10px; transform: rotate(90deg); }
@media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
#cv { position: absolute; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; image-rendering: pixelated; background: #000; }
button { touch-action: manipulation; font: inherit; color: var(--txt); background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
button:active { transform: translateY(1px); filter: brightness(1.2); }
button:disabled { opacity: .4; }
button.go { background: #c8961c; border-color: #ffcc33; color: #1a1300; }
button.ghost { background: transparent; }
button.icon { width: 38px; height: 38px; padding: 0; font-size: 18px; }
button.small { padding: 5px 9px; font-size: 12px; border-radius: 7px; }
.hidden { display: none !important; }
.screen { position: absolute; inset: 0; display: none; pointer-events: none; }
.screen.on { display: block; }
.screen > * { pointer-events: auto; }

/* title */
#title { background: radial-gradient(ellipse at center, rgba(11,12,18,.35), rgba(11,12,18,.9)); text-align: center; }
#title.on { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.logo { font-size: clamp(38px, 9vw, 72px); font-weight: 900; letter-spacing: 6px; color: var(--acc); text-shadow: 4px 4px 0 #6b3d00, 0 0 24px rgba(255,190,40,.35); line-height: 1; }
.logo small { display: block; font-size: .32em; letter-spacing: 10px; color: #fff; text-shadow: 2px 2px 0 #000; margin-top: 8px; }
.tag { color: var(--dim); font-size: 14px; }
.col { display: flex; gap: 12px; }
button.big { font-size: 18px; padding: 12px 30px; border-radius: 12px; }
.foot { position: absolute; bottom: 10px; left: 0; right: 0; color: #5d6378; font-size: 11px; }

/* bars */
.topbar { position: absolute; top: max(6px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); display: flex; gap: 8px; align-items: center; }
.chip { background: rgba(22,25,37,.9); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.chip.cr b { color: var(--acc); }
.chip.grade { color: #ffd98a; }
.chip .bar { width: 90px; height: 7px; background: #0b0c12; border-radius: 4px; overflow: hidden; }
.chip .bar i { display: block; height: 100%; background: linear-gradient(90deg, #4fa8ff, #8ad8ff); width: 0; }
.dot { background: var(--bad); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; font-weight: 900; }
.topbar .icon { margin-left: auto; }
.bottombar { position: absolute; bottom: max(6px, env(safe-area-inset-bottom)); left: 0; right: 0; display: flex; justify-content: center; gap: 8px; padding: 0 8px; }
.bottombar button { min-width: 72px; padding: 9px 12px; background: rgba(31,35,51,.93); }
.bottombar button.go { min-width: 96px; background: #c8961c; }

/* edit */
.hint { background: rgba(22,25,37,.92); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 13px; flex: 1; }
.drawer { position: absolute; top: 54px; bottom: max(6px, env(safe-area-inset-bottom)); right: max(6px, env(safe-area-inset-right)); width: 92px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding: 6px; background: rgba(22,25,37,.92); border: 1px solid var(--line); border-radius: 12px; touch-action: pan-y; }
.drawer .f { flex: 0 0 auto; padding: 4px; text-align: center; font-size: 11px; border-radius: 9px; background: var(--panel2); border: 2px solid transparent; position: relative; }
.drawer .f.sel { border-color: var(--acc); }
.drawer .f img { height: 30px; max-width: 100%; image-rendering: pixelated; display: block; margin: 0 auto 2px; }
.drawer .f .n { position: absolute; top: 2px; right: 4px; color: var(--acc); font-weight: 900; }
.drawer .shopbtn { flex: 0 0 auto; padding: 6px 2px; font-size: 12px; }
.drawer .empty { color: var(--dim); font-size: 11px; text-align: center; padding: 4px; }
.selbar { position: absolute; left: 50%; transform: translateX(-50%); top: 52px; display: flex; gap: 6px; align-items: center; background: rgba(22,25,37,.95); border: 1px solid var(--acc); border-radius: 12px; padding: 6px 8px; font-size: 13px; }
.selbar span { padding: 0 6px; font-weight: 700; }

/* HUD */
.hp { position: absolute; top: max(8px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; text-shadow: 1px 1px 0 #000; }
.hpbar { width: 150px; height: 12px; background: rgba(0,0,0,.6); border: 1px solid #000; border-radius: 3px; overflow: hidden; }
.hpbar i { display: block; height: 100%; background: linear-gradient(#ff7a6b, #c0392b); }
.goals { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: 12px; text-shadow: 1px 1px 0 #000; background: rgba(0,0,0,.35); padding: 4px 10px; border-radius: 8px; white-space: nowrap; pointer-events: none !important; }
.goals .ok { color: var(--good); }
.goals .exit { color: #4fe08a; font-weight: 900; }
.hudbtns { position: absolute; top: max(6px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); display: flex; gap: 6px; }
.hudbtns button { padding: 6px 12px; background: rgba(22,25,37,.75); }
.weapon { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 52px; display: flex; gap: 8px; align-items: center; background: rgba(22,25,37,.75); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 12px; }
.weapon img { width: 48px; image-rendering: pixelated; }
.weapon b { display: block; font-size: 12px; }
.weapon .rl { height: 3px; background: #000; margin-top: 3px; width: 70px; }
.weapon .rl i { display: block; height: 100%; width: 0; background: var(--acc); }
.reload { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 108px; background: rgba(22,25,37,.75); font-size: 12px; padding: 6px 10px; }
.credits { position: absolute; left: max(10px, env(safe-area-inset-left)); top: 30px; font-size: 12px; color: var(--acc); font-weight: 700; text-shadow: 1px 1px 0 #000; pointer-events: none !important; }
#touch { position: absolute; inset: 0; display: none; }
#touch.on { display: block; }
.stick { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.06); display: none; pointer-events: none; }
.stick.aim { border-color: rgba(255,110,90,.5); }
.stick .knob { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.35); }
.stick.aim .knob { background: rgba(255,110,90,.55); }

/* modal sheet */
.modal { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; justify-content: flex-end; }
.modal.center { justify-content: center; align-items: center; }
.sheet { width: min(620px, 74vw); height: 100%; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.modal.center .sheet { height: auto; max-height: 92%; border: 1px solid var(--line); border-radius: 14px; width: min(560px, 92vw); }
.sheet header { display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); gap: 10px; }
.sheet h2 { margin: 0; font-size: 17px; flex: 1; }
.body { padding: 12px; overflow-y: auto; flex: 1; touch-action: pan-y; font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
.row img { image-rendering: pixelated; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 700; font-size: 14px; }
.row .s { color: var(--dim); font-size: 12px; margin-top: 2px; }
.row.selected { border-color: var(--acc); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tabs button.on { background: #3a3220; border-color: var(--acc); color: var(--acc); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.card { background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 6px 4px; text-align: center; font-size: 11px; position: relative; }
.card img { width: 48px; height: 48px; image-rendering: pixelated; display: block; margin: 0 auto 3px; }
.card .tagx { position: absolute; top: 2px; left: 4px; font-size: 10px; color: var(--acc); }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.slot { background: #10131c; border: 2px dashed var(--line); border-radius: 10px; padding: 6px; text-align: center; font-size: 11px; min-height: 86px; }
.slot img { width: 44px; height: 44px; image-rendering: pixelated; display: block; margin: 0 auto 2px; }
.stat { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #2a2f40; }
.stat b { color: var(--txt); }
.up { color: var(--good); } .down { color: var(--bad); }
.sw { display: inline-block; width: 26px; height: 26px; border-radius: 6px; border: 2px solid #000; margin: 2px; vertical-align: middle; cursor: pointer; }
.sw.on { outline: 2px solid var(--acc); }
h3 { font-size: 13px; color: var(--dim); margin: 14px 0 6px; font-weight: 700; }
.big2 { font-size: 26px; font-weight: 900; text-align: center; margin: 4px 0 10px; }
.win { color: var(--acc); } .lose { color: var(--bad); }
textarea { width: 100%; height: 80px; background: #0b0c12; color: var(--txt); border: 1px solid var(--line); border-radius: 8px; font-size: 11px; padding: 6px; -webkit-user-select: text; user-select: text; }
#toasts { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 50; }
.toast { background: rgba(14,15,22,.92); border: 1px solid var(--line); border-radius: 10px; padding: 7px 14px; font-size: 13px; animation: tin .2s ease-out; }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } }

</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="800" height="450"></canvas>
  <div id="touch"></div>
  <div class="stick" id="stickL"><div class="knob"></div></div>
  <div class="stick aim" id="stickR"><div class="knob"></div></div>

  <!-- title -->
  <section id="title" class="screen">
    <div class="logo">IRON DOGS<small>아이언 독스</small></div>
    <div class="tag">돌연변이 기지를 소탕하고, 성장하고, 나만의 무기고를 꾸미자</div>
    <div class="col">
      <button class="big" id="bContinue">이어하기</button>
      <button class="big ghost" id="bNew">새로 시작</button>
    </div>
    <div class="foot">Cyberdogs(1994, Ronny Wester)의 공개 소스에서 영감을 받은 리메이크 · 모든 그래픽 새로 제작</div>
  </section>

  <!-- hub (armory) -->
  <section id="hub" class="screen">
    <div class="topbar">
      <div class="chip lv"><b id="hLv">Lv 1</b><div class="bar"><i id="hXp"></i></div><span id="hPts" class="dot hidden">!</span></div>
      <div class="chip cr">◈ <b id="hCr">0</b></div>
      <div class="chip grade" id="hGrade">창고 ★</div>
      <button class="icon" id="bSettings" title="설정">⚙</button>
    </div>
    <div class="bottombar">
      <button class="go" data-panel="missions">▶ 출격</button>
      <button data-panel="char">캐릭터</button>
      <button data-panel="weapons">무기</button>
      <button data-panel="gear">장비</button>
      <button data-panel="shop">상점</button>
      <button id="bEdit">꾸미기</button>
    </div>
  </section>

  <!-- decorate mode -->
  <section id="edit" class="screen">
    <div class="topbar">
      <div class="hint" id="editHint">오른쪽에서 가구를 골라 바닥을 탭하면 배치됩니다</div>
      <button class="go" id="bEditDone">완료</button>
    </div>
    <div class="selbar hidden" id="selBar">
      <span id="selName"></span>
      <button id="bSelMove">이동</button>
      <button id="bSelDisp">진열</button>
      <button id="bSelStore">보관</button>
      <button id="bSelCancel">✕</button>
    </div>
    <div class="drawer" id="drawer"></div>
  </section>

  <!-- mission HUD -->
  <section id="hud" class="screen">
    <div class="hp"><div class="hpbar"><i id="uHp"></i></div><span id="uHpT"></span></div>
    <div class="goals" id="uGoals"></div>
    <div class="hudbtns"><button id="bMap">지도</button><button id="bPause">Ⅱ</button></div>
    <div class="weapon" id="uWeapon"><img id="uWImg"><div><b id="uWName"></b><span id="uAmmo"></span><div class="rl"><i id="uRl"></i></div></div></div>
    <button class="reload" id="bReload">재장전</button>
    <div class="credits">◈ <span id="uCr">0</span></div>
  </section>

  <div id="modal" class="modal hidden"><div class="sheet"><header><h2 id="mTitle"></h2><button class="icon" id="mClose">✕</button></header><div class="body" id="mBody"></div></div></div>
  <div id="toasts"></div>
  <div id="rotate"><div><div class="ph">📱</div>화면을 <b>가로</b>로 돌려 주세요</div></div>
</div>
<script>
// ===================================================================
// art.js - original pixel art, built at runtime from strings / code
// ===================================================================
const T = 16; // tile size
const PAL = {
  k: '#0e0e16', x: '#1a1a24', d: '#262635', g: '#3d3d52', G: '#6b6b85', w: '#b9bccf', W: '#f2f2f7',
  s: '#e9b48a', S: '#b37a55', r: '#c0392b', R: '#ff6b5b', o: '#e67e22', y: '#f7d54a', l: '#7bd34f',
  e: '#2e8b3d', b: '#3b6fd6', B: '#8ab8ff', p: '#7d3fa0', P: '#c58cf0', n: '#6e4b2a', N: '#a87444',
  c: '#2ec4c4', C: '#9ff3f3', m: '#4a3020'
};

function hexToRgb(h) { const v = parseInt(h.slice(1), 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; }
function rgbToHex(r, g, b) { return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function shade(hex, f) { const [r, g, b] = hexToRgb(hex); return f < 1 ? rgbToHex(r * f, g * f, b * f) : rgbToHex(r + (255 - r) * (f - 1), g + (255 - g) * (f - 1), b + (255 - b) * (f - 1)); }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function spriteFrom(rows, map) {
  map = map || {};
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = mkCanvas(w, h), x = c.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < rows[j].length; i++) {
    const ch = rows[j][i];
    if (ch === '.' || ch === ' ') continue;
    const col = map[ch] || PAL[ch];
    if (!col) continue;
    x.fillStyle = col; x.fillRect(i, j, 1, 1);
  }
  return c;
}

// nearest-neighbour rotation (keeps the pixel look)
function rotated(src, ang, size, scale) {
  scale = scale || 1;
  const sw = src.width, sh = src.height;
  const sd = src.getContext('2d').getImageData(0, 0, sw, sh).data;
  const c = mkCanvas(size, size), ctx = c.getContext('2d'), img = ctx.createImageData(size, size), dd = img.data;
  const ca = Math.cos(-ang), sa = Math.sin(-ang);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = (x + 0.5 - size / 2) / scale, dy = (y + 0.5 - size / 2) / scale;
    const sx = Math.floor(dx * ca - dy * sa + sw / 2), sy = Math.floor(dx * sa + dy * ca + sh / 2);
    if (sx < 0 || sy < 0 || sx >= sw || sy >= sh) continue;
    const si = (sy * sw + sx) * 4, di = (y * size + x) * 4;
    if (sd[si + 3] < 128) continue;
    dd[di] = sd[si]; dd[di + 1] = sd[si + 1]; dd[di + 2] = sd[si + 2]; dd[di + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

// ---------- characters (all face right; rotated at runtime) ----------
const SPR_SOLDIER = [
  '................',
  '................',
  '.....kkkkk......',
  '....kAAAAAk.....',
  '...kAAAAAAAk....',
  '...kaAAkkkAAk...',
  '..kaAAkHHHkkkkk.',
  '..kaAkHHHHHksVVk',
  '..kaAkHHHhHkvVVk',
  '..kaAAkHhhkkkkk.',
  '...kaAAkkkAAk...',
  '...kaaAAAAAAk...',
  '....kaaaaaak....',
  '.....kkkkkk.....',
  '................',
  '................'];
const SPR_MUTANT = [
  '................',
  '................',
  '......kkkk......',
  '....kkAAAAk.kk..',
  '...kAAAAAAAkRRk.',
  '...kaAkkkAAAkk..',
  '..kaAkHHHkk.....',
  '..kaAkHHHHk.....',
  '..kaAkHhHHk.....',
  '..kaAkHhhkk.....',
  '...kaAkkkAAAkk..',
  '...kaaAAAAAkRRk.',
  '....kkaaaak.kk..',
  '......kkkk......',
  '................',
  '................'];

function charMap(look) {
  const m = { A: look.A, a: shade(look.A, 0.65), H: look.H, h: shade(look.H, 0.7) };
  if (look.V) { m.V = look.V; m.v = shade(look.V, 0.6); }
  if (look.s) m.s = look.s;
  return m;
}
const DIRS = 32;
const _rotCache = new Map();
function charSpriteLow(kind, look, ang, scale) {
  const d = ((Math.round(ang / (Math.PI * 2) * DIRS) % DIRS) + DIRS) % DIRS;
  const key = kind + '|' + look.A + look.H + (look.V || '') + '|' + d + '|' + (scale || 1);
  let c = _rotCache.get(key);
  if (!c) {
    const base = spriteFrom(kind === 'mutant' ? SPR_MUTANT : SPR_SOLDIER, charMap(look));
    const sz = Math.ceil(22 * (scale || 1));
    c = rotated(base, d / DIRS * Math.PI * 2, sz, scale || 1);
    _rotCache.set(key, c);
  }
  return c;
}
// flash-white version for hit feedback
const _flashCache = new Map();
function whiteOf(c) {
  let w = _flashCache.get(c);
  if (!w) {
    w = mkCanvas(c.width, c.height); const x = w.getContext('2d');
    x.drawImage(c, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, w.width, w.height);
    _flashCache.set(c, w);
  }
  return w;
}

// ---------- items ----------
const ICONS = {
  medkit: ['............', '.kkkkkkkkkk.', '.kWWWWWWWWk.', '.kWWWrrWWWk.', '.kWWWrrWWWk.', '.kWrrrrrrWk.',
    '.kWrrrrrrWk.', '.kWWWrrWWWk.', '.kWWWrrWWWk.', '.kwwwwwwwwk.', '.kkkkkkkkkk.', '............'],
  credit: ['............', '....kkkk....', '...kyyyyk...', '..kyyWyyyk..', '..kyWyyoyk..', '..kyyyyoyk..',
    '..kyyyoyyk..', '..kyoooyyk..', '...kyyyyk...', '....kkkk....', '............', '............'],
  disk: ['............', '.kkkkkkkkkk.', '.kbbbbbbbbk.', '.kbkWWWWkbk.', '.kbkWWWWkbk.', '.kbkkkkkkbk.',
    '.kbbbbbbbbk.', '.kbbGGGGbbk.', '.kbbGkkGbbk.', '.kbbGGGGbbk.', '.kkkkkkkkkk.', '............'],
  lootbox: ['............', '..kkkkkkkk..', '.kPPPPPPPPk.', '.kPyyyyyyPk.', '.kkkkkkkkkk.', '.kppppppppk.',
    '.kppkyykppk.', '.kppkyykppk.', '.kppppppppk.', '.kkkkkkkkkk.', '............', '............'],
};
const WEAPON_ICONS = {

// ---------- tiny pixel digits (3x5) for damage numbers ----------
const DIGITS = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111',
  '+': '000010111010000', '-': '000000111000000'
};
function drawDigits(ctx, str, x, y, col) {
  ctx.fillStyle = '#000';
  for (let pass = 0; pass < 2; pass++) {
    let cx = x;
    for (const ch of str) {
      const p = DIGITS[ch];
      if (p) for (let i = 0; i < 15; i++) if (p[i] === '1') ctx.fillRect(cx + i % 3 + (pass ? 0 : 1), y + (i / 3 | 0) + (pass ? 0 : 1), 1, 1);
      cx += 4;
    }
    ctx.fillStyle = col;
  }
}

let _uid = Date.now() % 100000;
function newId(p) { return (p || 'i') + (++_uid).toString(36) + Math.floor(Math.random() * 1296).toString(36); }

function rollRarity(level, bonus) {
  const r = Math.random() * 100 - (bonus || 0) - level * 0.8;
  if (r < 2) return 4; if (r < 9) return 3; if (r < 24) return 2; if (r < 52) return 1; return 0;
}
function makeGear(level, rarity, slot) {
  slot = slot || Object.keys(GEAR_SLOTS)[Math.random() * 4 | 0];
  if (rarity === undefined) rarity = rollRarity(level);
  const pool = GEAR_POOL[slot].slice(), stats = {};
  const n = Math.min(pool.length, 1 + Math.ceil(rarity / 1.5));
  for (let i = 0; i < n; i++) {
    const st = pool.splice(Math.random() * pool.length | 0, 1)[0];
    const pts = (1.5 + Math.random() * 1.5) * (1 + level * 0.18) * RARITY[rarity].mul;
    let v = pts * STAT_PER[st];
    v = st === 'regen' ? Math.round(v * 10) / 10 : Math.max(1, Math.round(v));
    stats[st] = v;
  }
  const bases = GEAR_BASES[slot];
  return {
    id: newId('g'), slot, rarity, level, stats,
    name: bases[Math.min(bases.length - 1, Math.floor(Math.random() * (1 + rarity)))],
    color: PAINTS[Math.random() * PAINTS.length | 0],
  };
}

function makeMission(level, seed) {
  const r = rnd32(seed);
  const types = Object.keys(OBJ_TYPES);
  const objs = [];
  const first = types[r() * 3 | 0];
  objs.push(first);
  if (level >= 4 && r() < 0.6) { const t2 = types.filter(t => t !== first)[r() * 2 | 0]; objs.push(t2); }
  const goals = objs.map(t => ({ type: t, need: t === 'kill' ? 8 + level * 2 : t === 'collect' ? 3 + Math.min(4, level / 3 | 0) : 2 + Math.min(3, level / 4 | 0), got: 0 }));
  return {
    seed, level, theme: r() * MISSION_THEMES.length | 0,
    name: MISSION_NAMES[r() * MISSION_NAMES.length | 0],
    goals, rewardCr: 250 + level * 160, rewardXp: 70 + level * 45,
  };
}

let S = null;
function loadGame() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { S = migrate(JSON.parse(raw)); return true; } } catch (e) { console.warn(e); }
  S = null; return false;
}
function migrate(s) {
  const d = newSave();
  for (const k in d) if (s[k] === undefined) s[k] = d[k];
  s.room.hero = s.room.hero || { x: 10, y: 7 };
  return s;
}
let _saveTimer = 0;
function saveGame(now) {
  if (!S) return;
  clearTimeout(_saveTimer);
  const doit = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { console.warn(e); } };
  if (now) doit(); else _saveTimer = setTimeout(doit, 300);
}
function exportCode() { return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function importCode(code) {
  const s = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
  if (!s || !s.stats || !s.room) throw new Error('bad');
  S = migrate(s); saveGame(true);
}

// ---------- helpers ----------
function itemById(id) { return S.inv.find(i => i.id === id) || null; }
function equippedItems() { return Object.values(S.equip).map(itemById).filter(Boolean); }
function gearTotals() {
  const t = { hp: 0, armor: 0, speed: 0, dmg: 0, crit: 0, regen: 0, rate: 0 };
  equippedItems().forEach(it => { for (const k in it.stats) t[k] += it.stats[k]; });
  return t;
}
function playerStats() {
  const g = gearTotals(), st = S.stats, bonus = roomBonus();
  return {
    maxHp: Math.round(100 + st.vit * 12 + g.hp + (S.lvl - 1) * 4),
    armor: st.def * 3 + g.armor,
    speed: 72 * (1 + st.agi * 0.03 + g.speed / 100),
    dmgMul: 1 + st.atk * 0.04 + g.dmg / 100,
    rateMul: 1 + st.agi * 0.02 + g.rate / 100,
    crit: 5 + g.crit,
    regen: g.regen,
    rewardMul: 1 + bonus.reward,
  };
}
function lookOf() {
  const h = itemById(S.equip.helmet), a = itemById(S.equip.armor);
  return { A: a ? a.color : '#3f5a3a', H: h ? h.color : '#6b7a52', s: '#e9b48a' };
}
function isDisplayed(itemId) {
  return S.room.items.some(f => (f.disp || []).includes(itemId));
}
function undisplay(itemId) {
  S.room.items.forEach(f => { if (f.disp) f.disp = f.disp.map(d => d === itemId ? null : d); });
}

// ---------- armory decoration score ----------
const GRADE_STEPS = [0, 10, 25, 45, 70, 100, 140];
function decoScore() {
  let s = ROOM_FLOORS[S.room.floor].deco + ROOM_WALLS[S.room.wall].deco;
  S.room.items.forEach(f => {
    const def = FURNITURE[f.id]; s += def.deco;
    (f.disp || []).forEach(d => {
      if (!d) return;
      if (def.slots && def.slots.type === 'weapon') { const w = S.weapons[d]; if (w) s += 1 + Math.floor(w.lvl / 3); }
      else { const it = itemById(d); if (it) s += 1 + it.rarity; }
    });
  });
  return s;
}
function roomGrade() {
  const s = decoScore(); let g = 1;
  for (let i = 1; i < GRADE_STEPS.length; i++) if (s >= GRADE_STEPS[i]) g = i + 1;
  return { grade: g, score: s, next: GRADE_STEPS[g] };
}
function roomBonus() {
  const g = S ? roomGrade().grade : 1;
  const bench = S && S.room.items.some(f => f.id === 'bench');
  return { reward: (g - 1) * 0.05, upgradeDiscount: bench ? 0.05 : 0 };
}

// ---------- progression ----------
function addXp(n) {
  S.xp += n; let ups = 0;
  while (S.xp >= xpNeed(S.lvl)) { S.xp -= xpNeed(S.lvl); S.lvl++; S.points += 3; ups++; }
  return ups;
}
function refreshOffers(force) {
  if (S.offers && !force) return;
  const L = S.lvl;
  const lv = [Math.max(1, L - 1), L, L + 2];
  S.offerSeed = (S.offerSeed * 1103515245 + 12345) >>> 0;
  S.offers = lv.map((l, i) => makeMission(l, (S.offerSeed + i * 7919) >>> 0));
}

// audio.js - tiny synthesized sound effects (no files)

const SFX = (() => {
  let ac = null, master = null, noiseBuf = null, last = {};
  function init() {
    if (ac) { if (ac.state !== 'running') { try { ac.resume(); } catch (e) { } } return; }   // iOS: 'suspended' / 'interrupted'
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.35; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  function on() { return ac && S && S.settings.sound; }
  function noise(dur, f0, f1, vol, type) {
    const t = ac.currentTime, src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; flt.type = type || 'lowpass'; flt.frequency.setValueAtTime(f0, t); flt.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(master); src.start(t); src.stop(t + dur);
  }
  function tone(f0, f1, dur, vol, type, delay) {
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur);
  }
  const defs = {
    pistol: () => { noise(0.09, 3000, 400, 0.5); tone(300, 80, 0.06, 0.15); },
    smg: () => noise(0.06, 2500, 500, 0.35),
    shotgun: () => { noise(0.25, 1800, 120, 0.7); tone(120, 40, 0.15, 0.3); },
    flamer: () => noise(0.12, 900, 300, 0.12, 'bandpass'),
    launcher: () => { tone(220, 90, 0.18, 0.25, 'sawtooth'); noise(0.1, 800, 200, 0.3); },
    laser: () => { tone(1800, 300, 0.18, 0.18, 'sawtooth'); },
    enemyShot: () => { tone(700, 200, 0.1, 0.1, 'square'); },
    boom: () => { noise(0.6, 900, 60, 0.9); tone(90, 30, 0.4, 0.4, 'sine'); },
    hit: () => tone(220, 110, 0.05, 0.12),
    hurt: () => { tone(160, 60, 0.15, 0.25, 'sawtooth'); },
    die: () => { noise(0.3, 1200, 100, 0.4); tone(200, 40, 0.3, 0.2); },
    pickup: () => { tone(660, 660, 0.06, 0.15); tone(990, 990, 0.08, 0.15, 'square', 0.06); },
    coin: () => { tone(1300, 1300, 0.05, 0.1); tone(1750, 1750, 0.08, 0.1, 'square', 0.05); },
    reload: () => { tone(400, 400, 0.03, 0.1); tone(600, 600, 0.03, 0.1, 'square', 0.12); },
    click: () => tone(800, 800, 0.03, 0.08),
    buy: () => { tone(523, 523, 0.07, 0.15); tone(659, 659, 0.07, 0.15, 'square', 0.07); tone(784, 784, 0.12, 0.15, 'square', 0.14); },
    levelup: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.14, 0.18, 'square', i * 0.1)); },
    alert: () => { tone(880, 440, 0.2, 0.12, 'triangle'); },
    exit: () => { [392, 523, 659, 784].forEach((f, i) => tone(f, f, 0.1, 0.15, 'triangle', i * 0.07)); },
  };
  return {
    init,
    play(name, minGap) {
      if (!on() || !defs[name]) return;

    suspend(b) { if (ac) { b ? ac.suspend() : ac.resume(); } },

})();

// ===================================================================
// mission.js - top-down combat: map generation, AI, weapons, rendering
// ===================================================================
const VW = 400, VH = 225;
const TILE_FLOOR = 0, TILE_WALL = 1, TILE_CRATE = 2, TILE_GEN = 3;
let M = null; // current mission

// ---------------- map generation ----------------
function genMap(def) {
  const r = rnd32(def.seed * 7 + 1);
  const W = 44, H = 32, tiles = new Uint8Array(W * H).fill(TILE_WALL);
  const rooms = [];
  for (let a = 0; a < 300 && rooms.length < 11; a++) {
    const w = 5 + (r() * 6 | 0), h = 4 + (r() * 5 | 0);
    const x = 1 + (r() * (W - w - 2) | 0), y = 1 + (r() * (H - h - 2) | 0);
    if (rooms.some(o => x < o.x + o.w + 2 && x + w + 2 > o.x && y < o.y + o.h + 2 && y + h + 2 > o.y)) continue;
    rooms.push({ x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) });

// ---------------- finishing ----------------
function finishMission(m) {

    cr = Math.round((m.gained.cr + m.def.rewardCr) * ps.rewardMul);
    xp = Math.round((m.gained.xp + m.def.rewardXp) * ps.rewardMul);
    items = m.gained.items.slice();
    const n = 1 + (m.L >= 5 ? 1 : 0) + (Math.random() < 0.3 ? 1 : 0);
    for (let i = 0; i < n; i++) items.push(makeGear(m.L, rollRarity(m.L, 8)));
    S.record.missions++; S.record.best = Math.max(S.record.best, m.L);
  } else {
    cr = Math.round(m.gained.cr * 0.5); xp = Math.round(m.gained.xp * 0.5);
  }
  S.credits += cr;
  const ups = addXp(xp);
  const room = 40 - S.inv.length; const kept = items.slice(0, Math.max(0, room)); const sold = items.slice(kept.length);
  kept.forEach(it => S.inv.push(it));
  const soldCr = sold.reduce((a, it) => a + gearValue(it), 0); S.credits += soldCr;
  S.record.kills += m.kills;
  refreshOffers(true);
  saveGame(true);
  UI.showResult({ win, cr, xp, ups, items: kept, soldCr, kills: m.kills, time: m.time, name: m.def.name, level: m.L });
}

  if (m.unique && m.unique.announced && m.enemies.includes(m.unique)) { ctx.fillStyle = '#ffb020'; ctx.fillRect(ox + (m.unique.x / T) * s - 2, oy + (m.unique.y / T) * s - 2, 4, 4); }
  ctx.fillStyle = m.exit.active ? '#4fe08a' : '#2a6a40'; ctx.fillRect(ox + m.exit.tx * s - 1, oy + m.exit.ty * s - 1, s + 2, s + 2);
  if ((t * 3 | 0) % 2) { ctx.fillStyle = '#ffffff'; ctx.fillRect(ox + (m.player.x / T) * s - 2, oy + (m.player.y / T) * s - 2, 4, 4); }
}

// ===================================================================
// room.js - the armory (home base): rendering, decorating, hero walk
// ===================================================================
const ROOM_OX = (VW - ROOM_W * T) / 2, ROOM_OY = 26;
const RE = { on: false, placeId: null, sel: null, moving: false, flash: null, hero: null };

function roomTileAt(px, py) { return { x: Math.floor((px - ROOM_OX) / T), y: Math.floor((py - ROOM_OY) / T) }; }
function canPlace(id, x, y, ignoreUid) {
  const f = FURNITURE[id];
  if (x < 0 || x + f.w > ROOM_W) return false;
  if (f.layer === 'wall') { if (y !== 0) return false; }
  else if (y < 1 || y + f.h > ROOM_H) return false;
  return !S.room.items.some(o => {
    if (o.uid === ignoreUid) return false;
    const g = FURNITURE[o.id];
    if (g.layer !== f.layer) return false;
    return x < o.x + g.w && x + f.w > o.x && y < o.y + g.h && y + f.h > o.y;
  });
}
function findSpot(id) {
  for (let y = 0; y < ROOM_H; y++) for (let x = 0; x < ROOM_W; x++) if (canPlace(id, x, y)) return { x, y };
  return null;
}
function roomPick(px, py) {
  const { x, y } = roomTileAt(px, py);
  const hit = S.room.items.filter(o => { const g = FURNITURE[o.id]; return x >= o.x && x < o.x + g.w && y >= o.y && y < o.y + g.h; });
  const order = { obj: 2, wall: 1, floor: 0 };
  hit.sort((a, b) => order[FURNITURE[b.id].layer] - order[FURNITURE[a.id].layer]);
  return hit[0] || null;
}
function resolveDisp(o) {
  const f = FURNITURE[o.id];
  if (!f.slots) return [];
  return (o.disp || []).map(d => {
    if (!d) return null;
    if (f.slots.type === 'weapon') return S.weapons[d] ? { key: d, paint: S.weapons[d].paint } : null;
    return itemById(d);
  });
}

// ---------- actions ----------
function placeFurniture(id, x, y) {
  if (!S.furnInv[id] || !canPlace(id, x, y)) return false;
  S.furnInv[id]--; if (!S.furnInv[id]) delete S.furnInv[id];
  const f = FURNITURE[id];
  S.room.items.push({ uid: newId('f'), id, x, y, disp: f.slots ? new Array(f.slots.n).fill(null) : [] });
  saveGame(); return true;
}
function storeFurniture(uid) {
  const i = S.room.items.findIndex(o => o.uid === uid); if (i < 0) return;
  const o = S.room.items[i]; S.room.items.splice(i, 1);
  S.furnInv[o.id] = (S.furnInv[o.id] || 0) + 1; saveGame();
}
function moveFurniture(uid, x, y) {
  const o = S.room.items.find(q => q.uid === uid); if (!o || !canPlace(o.id, x, y, uid)) return false;
  o.x = x; o.y = y; saveGame(); return true;
}

// ---------- hero walking ----------
function heroState() {
  if (!RE.hero) RE.hero = { x: ROOM_OX + S.room.hero.x * T + 8, y: ROOM_OY + S.room.hero.y * T + 8, tx: null, ty: null, ang: Math.PI / 2, step: 0 };
  return RE.hero;
}
function heroWalkTo(px, py) {
  const h = heroState();
  h.tx = Math.max(ROOM_OX + 8, Math.min(ROOM_OX + ROOM_W * T - 8, px));
  h.ty = Math.max(ROOM_OY + T + 6, Math.min(ROOM_OY + ROOM_H * T - 8, py));
}
function updateRoom(dt) {
  const h = heroState();
  if (h.tx !== null) {
    const dx = h.tx - h.x, dy = h.ty - h.y, d = Math.hypot(dx, dy);
    if (d < 1.5) { h.tx = null; S.room.hero = { x: Math.floor((h.x - ROOM_OX) / T), y: Math.floor((h.y - ROOM_OY) / T) }; saveGame(); }
    else { const sp = Math.min(d, 60 * dt); h.x += dx / d * sp; h.y += dy / d * sp; h.ang = Math.atan2(dy, dx); h.step += dt * 10; }
  }
  if (RE.flash) { RE.flash.t -= dt; if (RE.flash.t <= 0) RE.flash = null; }
}

// ---------- render ----------
function renderRoom(ctx, t) {
  // backdrop
  ctx.fillStyle = '#0b0c12'; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = '#12131c'; for (let y = 0; y < VH; y += 8) for (let x = (y / 8 % 2) * 8; x < VW; x += 16) ctx.fillRect(x, y, 8, 8);
  const ox = ROOM_OX, oy = ROOM_OY, W = ROOM_W * T, H = ROOM_H * T;
  ctx.fillStyle = '#000'; ctx.fillRect(ox - 3, oy - 22, W + 6, H + 25);
  // floor (cached at fine resolution)
  if (!RE.floorC || RE.floorId !== S.room.floor) {
    RE.floorId = S.room.floor; RE.floorC = mkCanvas(ROOM_W * FT, ROOM_H * FT);
    const fx = RE.floorC.getContext('2d'), fn = ROOM_FLOOR_F[S.room.floor] || ROOM_FLOOR_F.metal;
    for (let j = 1; j < ROOM_H; j++) for (let i = 0; i < ROOM_W; i++) fn(fx, i * FT, j * FT, i, j);
  }
  ctx.drawImage(RE.floorC, ox, oy, W, H);
  // wall (row 0 plus a strip above)
  ctx.save(); ctx.scale(1 / RS, 1 / RS);
  roomWallF(ctx, ox * RS, (oy - 20) * RS, W * RS, (T + 20) * RS, ROOM_WALLS[S.room.wall], S.room.wall, t);
  ctx.restore();
  const sg = ctx.createLinearGradient(0, oy + T, 0, oy + T + 8); sg.addColorStop(0, 'rgba(0,0,0,0.4)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg; ctx.fillRect(ox, oy + T, W, 8);
  // edit grid
  if (RE.on) {
    ctx.fillStyle = 'rgba(255,255,255,0.09)';
    for (let i = 0; i <= ROOM_W; i++) ctx.fillRect(ox + i * T, oy, 0.5, H);
    for (let j = 0; j <= ROOM_H; j++) ctx.fillRect(ox, oy + j * T, W, 0.5);
  }
  const draw = o => {
    const f = FURNITURE[o.id];
    drawFurnitureHi(ctx, o, ox + o.x * T, oy + o.y * T, t, resolveDisp(o));
    if (RE.on && RE.sel === o.uid) { ctx.strokeStyle = (t * 4 | 0) % 2 ? '#ffd34a' : '#fff'; ctx.lineWidth = 0.75; ctx.strokeRect(ox + o.x * T + 0.5, oy + o.y * T + 0.5, f.w * T - 1, f.h * T - 1); }
  };
  S.room.items.filter(o => FURNITURE[o.id].layer === 'floor').forEach(draw);
  S.room.items.filter(o => FURNITURE[o.id].layer === 'wall').forEach(draw);
  // objects + hero sorted by depth
  const h = heroState();
  const objs = S.room.items.filter(o => FURNITURE[o.id].layer === 'obj').map(o => ({ y: oy + (o.y + FURNITURE[o.id].h) * T, fn: () => draw(o) }));
  objs.push({ y: h.y + 6, fn: () => {
    const look = Object.assign({}, lookOf()); const wk = S.loadout[0]; look.V = wk && S.weapons[wk] ? S.weapons[wk].paint : '#6b6b85';
    const spr = charSprite('soldier', look, h.ang);
    ctx.fillStyle = 'rgba(0,0,0,0.32)'; ctx.beginPath(); ctx.ellipse(h.x + 1, h.y + 5, 6, 2.6, 0, 0, 6.2832); ctx.fill();
    drawFineCentered(ctx, spr, h.x, h.y - (h.tx !== null ? Math.abs(Math.sin(h.step)) : 0));
  } });
  objs.sort((a, b) => a.y - b.y).forEach(o => o.fn());
  // lamp glow
  ctx.globalCompositeOperation = 'lighter';
  S.room.items.filter(o => FURNITURE[o.id].light).forEach(o => {
    const x = ox + o.x * T + 8, y = oy + o.y * T - 4, g = ctx.createRadialGradient(x, y, 2, x, y, 46);
    g.addColorStop(0, 'rgba(255,220,120,0.35)'); g.addColorStop(1, 'rgba(255,220,120,0)'); ctx.fillStyle = g; ctx.fillRect(x - 46, y - 46, 92, 92);
  });
  ctx.globalCompositeOperation = 'source-over';
  // placement ghost
  if (RE.on && RE.ghost) {
    const id = RE.placeId || (RE.moving && S.room.items.find(o => o.uid === RE.sel)?.id);
    if (id) {
      const f = FURNITURE[id], ok = canPlace(id, RE.ghost.x, RE.ghost.y, RE.moving ? RE.sel : null);
      ctx.globalAlpha = 0.6; drawFurnitureHi(ctx, { id }, ox + RE.ghost.x * T, oy + RE.ghost.y * T, t, []); ctx.globalAlpha = 1;
      ctx.fillStyle = ok ? 'rgba(80,220,120,0.28)' : 'rgba(230,60,60,0.35)'; ctx.fillRect(ox + RE.ghost.x * T, oy + RE.ghost.y * T, f.w * T, f.h * T);
    }
  }
  if (RE.flash) { ctx.fillStyle = `rgba(230,60,60,${RE.flash.t})`; ctx.fillRect(ox + RE.flash.x * T, oy + RE.flash.y * T, T, T); }
}

// ---------- pointer handling (called by UI with canvas coordinates) ----------
function roomPointer(px, py, kind) {
  const tile = roomTileAt(px, py), inRoom = tile.x >= 0 && tile.y >= 0 && tile.x < ROOM_W && tile.y < ROOM_H;
  if (RE.on) {
    if (kind === 'move') { RE.ghost = inRoom ? tile : null; return; }
    if (kind !== 'tap' || !inRoom) return;
    if (RE.placeId) {
      if (placeFurniture(RE.placeId, tile.x, tile.y)) { SFX.play('click'); if (!S.furnInv[RE.placeId]) RE.placeId = null; UI.refreshEdit(); }
      else { RE.flash = { x: tile.x, y: tile.y, t: 0.5 }; RE.ghost = tile; }
      return;
    }
    if (RE.moving && RE.sel) {
      if (moveFurniture(RE.sel, tile.x, tile.y)) { RE.moving = false; SFX.play('click'); UI.refreshEdit(); }
      else { RE.flash = { x: tile.x, y: tile.y, t: 0.5 }; RE.ghost = tile; }
      return;
    }
    const o = roomPick(px, py);
    RE.sel = o ? o.uid : null; RE.ghost = null; SFX.play('click'); UI.refreshEdit();
    return;
  }
  if (kind !== 'tap' || !inRoom) return;
  const o = roomPick(px, py);
  if (o && FURNITURE[o.id].slots) { UI.openDisplay(o.uid); return; }
  if (o) { UI.toast(FURNITURE[o.id].name + (FURNITURE[o.id].desc ? ' · ' + FURNITURE[o.id].desc : '')); return; }
  if (tile.y >= 1) heroWalkTo(px, py);
}

    const list = S.inv.filter(it => !Object.values(S.equip).includes(it.id)).sort((a, b) => b.rarity - a.rarity || b.level - a.level);
    h += `<h3>보관함 ${S.inv.length}/${INV_MAX} <button class="small" data-a="gsellall" style="float:right">일반 등급 일괄 판매</button></h3>`;
    h += list.length ? '<div class="grid">' + list.map(it => `<div class="card" data-a="gsel" data-id="${it.id}" style="border-color:${RARITY[it.rarity].color}">
      ${isDisplayed(it.id) ? '<span class="tagx">전시</span>' : ''}<img src="${this.icon('gear', it.slot, it.color)}"><div style="color:${RARITY[it.rarity].color}">${it.name}</div><div class="s">Lv${it.level} ${GEAR_SLOTS[it.slot]}</div></div>`).join('') + '</div>'
      : '<div class="s">보관 중인 장비가 없습니다. 임무와 보급 상자에서 얻을 수 있습니다.</div>';
    return ['장비', h];
  },
  gearDetail(it) {
    const eqId = S.equip[it.slot], eq = itemById(eqId), equipped = eqId === it.id;
    const keys = new Set([...Object.keys(it.stats), ...(eq && !equipped ? Object.keys(eq.stats) : [])]);
    let h = `<div class="row" style="border-color:${RARITY[it.rarity].color}"><img src="${this.icon('gear', it.slot, it.color, 6)}" width="72"><div class="grow">
      <div class="t" style="color:${RARITY[it.rarity].color}">${it.name}</div><div class="s">${RARITY[it.rarity].name} · ${GEAR_SLOTS[it.slot]} · Lv${it.level}${isDisplayed(it.id) ? ' · 창고에 전시 중' : ''}</div></div></div>`;
    h += '<h3>능력치' + (eq && !equipped ? ' (현재 장착 장비와 비교)' : '') + '</h3>';
    keys.forEach(k => {
      const v = it.stats[k] || 0, o = eq && !equipped ? (eq.stats[k] || 0) : null, diff = o === null ? 0 : v - o;
      h += `<div class="stat"><span>${STAT_NAMES[k]}</span><b>+${k === 'regen' ? v.toFixed(1) : v}${STAT_UNIT[k]} ${o !== null && diff ? `<span class="${diff > 0 ? 'up' : 'down'}">(${diff > 0 ? '+' : ''}${k === 'regen' ? diff.toFixed(1) : diff})</span>` : ''}</b></div>`;
    });
    h += `<h3>도색 (◈100)</h3><div>${PAINTS.map(c => `<span class="sw ${c === it.color ? 'on' : ''}" style="background:${c}" data-a="gpaint" data-id="${it.id}" data-c="${c}"></span>`).join('')}</div>`;
    h += `<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="small" data-a="gback">← 목록</button>
      ${equipped ? `<button data-a="gunequip" data-s="${it.slot}">장착 해제</button>` : `<button class="go" data-a="gequip" data-id="${it.id}">장착하기</button>`}
      ${equipped ? '' : `<button data-a="gsell" data-id="${it.id}">판매 ◈${fmt(gearValue(it))}</button>`}</div>`;
    return ['장비 상세', h];
  },
  a_gsel(d) { this.sub.sel = d.id; this.render(); },
  a_gback() { this.sub.sel = null; this.render(); },
  a_gequip(d) { const it = itemById(d.id); if (!it) return; if (isDisplayed(it.id)) { undisplay(it.id); this.toast('전시에서 내려 장착했습니다'); } S.equip[it.slot] = it.id; saveGame(); SFX.play('pickup'); this.sub.sel = null; this.render(); },
  a_gunequip(d) { S.equip[d.s] = null; saveGame(); SFX.play('click'); this.render(); },
  a_gsell(d) { const i = S.inv.findIndex(x => x.id === d.id); if (i < 0) return; const it = S.inv[i]; undisplay(it.id); S.inv.splice(i, 1); S.credits += gearValue(it); saveGame(); SFX.play('coin'); this.sub.sel = null; this.render(); },
  a_gsellall() {
    let n = 0, cr = 0;
    S.inv = S.inv.filter(it => { if (it.rarity === 0 && !Object.values(S.equip).includes(it.id) && !isDisplayed(it.id)) { n++; cr += gearValue(it); return false; } return true; });
    if (n) { S.credits += cr; saveGame(); SFX.play('coin'); this.toast(`${n}개 판매 · ◈${fmt(cr)}`); } else this.toast('판매할 일반 등급 장비가 없습니다');
    this.render();
  },
  a_gpaint(d) { const it = itemById(d.id); if (!it || it.color === d.c) return; if (S.credits < 100) { this.toast('크레딧이 부족합니다'); return; } S.credits -= 100; it.color = d.c; saveGame(); SFX.play('click'); this.render(); },

  // ---------------- shop ----------------
  p_shop() {
    const tab = this.sub.tab || 'furn';
    let h = `<div class="tabs">${[['furn', '가구'], ['interior', '바닥·벽'], ['box', '보급 상자']].map(([k, n]) => `<button class="${tab === k ? 'on' : ''}" data-a="tab" data-t="${k}">${n}</button>`).join('')}</div>`;
    if (tab === 'furn') {
      h += '<div class="s" style="margin-bottom:8px">구매한 가구는 [꾸미기]에서 배치합니다. 가구와 전시품이 많을수록 창고 등급이 오르고 임무 보상이 늘어납니다.</div>';
      FURN_ORDER.forEach(id => {
        const f = FURNITURE[id], own = (S.furnInv[id] || 0) + S.room.items.filter(o => o.id === id).length;
        h += `<div class="row"><img src="${this.furnIcon(id)}" style="height:48px"><div class="grow"><div class="t">${f.name} <span class="s">장식 +${f.deco}</span></div>
          <div class="s">${f.desc || (f.layer === 'wall' ? '벽에 거는 장식' : f.layer === 'floor' ? '바닥 장식 (위에 가구 배치 가능)' : f.w + '×' + f.h + ' 칸')}${own ? ` · 보유 ${own}` : ''}</div></div>
          <button class="go small" data-a="fbuy" data-id="${id}" ${S.credits >= f.price ? '' : 'disabled'}>◈${fmt(f.price)}</button></div>`;
      });
    } else if (tab === 'interior') {
      [['floor', ROOM_FLOORS, '바닥'], ['wall', ROOM_WALLS, '벽']].forEach(([kind, set, label]) => {
        h += `<h3>${label}</h3>`;
        for (const id in set) {
          const t = set[id], own = S.themes[kind].includes(id), cur = S.room[kind] === id;
          h += `<div class="row ${cur ? 'selected' : ''}"><div class="grow"><div class="t">${t.name} <span class="s">장식 +${t.deco}</span></div></div>
            ${cur ? '<span class="s">사용 중</span>' : own ? `<button class="small" data-a="theme" data-k="${kind}" data-id="${id}">적용</button>` : `<button class="go small" data-a="theme" data-k="${kind}" data-id="${id}" ${S.credits >= t.price ? '' : 'disabled'}>◈${fmt(t.price)}</button>`}</div>`;
        }
      });
    } else {
      const boxes = [['basic', '일반 보급 상자', 500 + S.lvl * 60, '현재 레벨 장비 1개'], ['elite', '정예 보급 상자', 1800 + S.lvl * 200, '희귀 등급 이상 확률 대폭 증가']];
      boxes.forEach(([k, n, price, desc]) => h += `<div class="row"><img src="${this.icon('icon', 'lootbox', '', 5)}" width="56"><div class="grow"><div class="t">${n}</div><div class="s">${desc}</div></div>
        <button class="go small" data-a="box" data-k="${k}" data-p="${price}" ${S.credits >= price && S.inv.length < INV_MAX ? '' : 'disabled'}>◈${fmt(price)}</button></div>`);
      if (this.sub.got) { const it = itemById(this.sub.got); if (it) h += `<h3>획득!</h3><div class="row" data-a="gotoGear" data-id="${it.id}" style="border-color:${RARITY[it.rarity].color}"><img src="${this.icon('gear', it.slot, it.color)}" width="48"><div class="grow"><div class="t" style="color:${RARITY[it.rarity].color}">${it.name}</div><div class="s">${RARITY[it.rarity].name} · ${GEAR_SLOTS[it.slot]} · ${Object.keys(it.stats).map(k => STAT_NAMES[k] + ' +' + it.stats[k] + STAT_UNIT[k]).join(', ')}</div></div></div>`; }
    }
    return ['상점', h];
  },
  a_tab(d) { this.sub.tab = d.t; this.sub.got = null; this.render(); },
  a_fbuy(d) { const f = FURNITURE[d.id]; if (S.credits < f.price) return; S.credits -= f.price; S.furnInv[d.id] = (S.furnInv[d.id] || 0) + 1; saveGame(); SFX.play('buy'); this.toast(`${f.name} 구매 · [꾸미기]에서 배치하세요`); this.render(); },
  a_theme(d) {
    const set = d.k === 'floor' ? ROOM_FLOORS : ROOM_WALLS, t = set[d.id];
    if (!S.themes[d.k].includes(d.id)) { if (S.credits < t.price) return; S.credits -= t.price; S.themes[d.k].push(d.id); SFX.play('buy'); }
    S.room[d.k] = d.id; saveGame(); this.render();
  },
  a_box(d) {
    const p = +d.p; if (S.credits < p || S.inv.length >= INV_MAX) return;
    S.credits -= p; const it = makeGear(S.lvl, rollRarity(S.lvl, d.k === 'elite' ? 30 : 0)); S.inv.push(it); saveGame();
    SFX.play(it.rarity >= 3 ? 'levelup' : 'buy'); this.sub.got = it.id; this.render();
  },
  a_gotoGear(d) { this.openPanel('gear', { sel: d.id }); },

  // ---------------- missions ----------------
  p_missions() {
    refreshOffers();
    let h = '<div class="s" style="margin-bottom:8px">목표를 모두 달성한 뒤 초록색 출구로 나가면 성공입니다. 쓰러지면 획득한 크레딧·경험치의 절반만 남고 장비는 잃습니다.</div>';
    S.offers.forEach((o, i) => {
      const diff = o.level - S.lvl, col = diff >= 2 ? 'var(--bad)' : diff >= 0 ? 'var(--acc)' : 'var(--good)';
      h += `<div class="row"><div class="grow"><div class="t">${o.name} <span style="color:${col}">권장 Lv ${o.level}</span></div>
        <div class="s">${MISSION_THEMES[o.theme].name} · ${o.goals.map(g => OBJ_TYPES[g.type].text(g.need)).join(' + ')}</div>
        <div class="s">보상 ◈${fmt(o.rewardCr)} · 경험치 ${fmt(o.rewardXp)} · 장비 상자</div></div><button class="go" data-a="mgo" data-i="${i}">출격</button></div>`;
    });
    h += `<div class="s">출격 무기: ${S.loadout.filter(Boolean).map(k => WEAPONS[k].name + ' +' + S.weapons[k].lvl).join(', ')} · 최대 체력 ${playerStats().maxHp}</div>
      <button class="small" data-a="mreroll" style="margin-top:8px">다른 임무 보기</button>`;
    return ['출격 — 임무 선택', h];
  },
  a_mgo(d) { const def = S.offers[+d.i]; this.closeModal(); Game.startMission(def); },
  a_mreroll() { refreshOffers(true); saveGame(); this.render(); },

  // ---------------- display furniture ----------------
  openDisplay(uid) { this.openPanel('display', { uid }); },
  p_display() {
    const o = S.room.items.find(q => q.uid === this.sub.uid); if (!o) return ['', ''];
    const f = FURNITURE[o.id], type = f.slots.type, disp = resolveDisp(o);
    const slotNames = type === 'gearset' ? ['헬멧', '방탄복', '부츠'] : null;
    let h = `<div class="s" style="margin-bottom:8px">${f.desc} 전시품은 창고 등급 점수에 더해집니다 (희귀할수록 높음).</div><div class="slots" style="grid-template-columns:repeat(${f.slots.n},1fr)">`;
    for (let i = 0; i < f.slots.n; i++) {
      const v = disp[i];
      const img = !v ? '' : type === 'weapon' ? `<img src="${this.icon('weapon', v.key, v.paint)}" style="width:72px;height:36px">` : `<img src="${this.icon('gear', v.slot, v.color)}">`;
      h += `<div class="slot ${this.sub.pick === i ? 'selected' : ''}" data-a="dslot" data-i="${i}" style="${this.sub.pick === i ? 'border-color:var(--acc);border-style:solid' : ''}">${img || '<div style="padding-top:20px;color:var(--dim)">비어 있음</div>'}
        <div class="s">${slotNames ? slotNames[i] : (i + 1) + '번'}${v ? '' : ''}</div></div>`;
    }
    h += '</div>';
    if (this.sub.pick !== undefined && this.sub.pick !== null) {
      const i = this.sub.pick;
      h += `<h3>${slotNames ? slotNames[i] : (i + 1) + '번 칸'}에 놓을 것 선택</h3><div class="grid">`;
      h += `<div class="card" data-a="dput" data-v=""><div style="height:48px;line-height:48px">✕</div>비우기</div>`;
      if (type === 'weapon') Object.keys(S.weapons).forEach(k => { h += `<div class="card" data-a="dput" data-v="${k}"><img src="${this.icon('weapon', k, S.weapons[k].paint)}" style="width:64px;height:32px;margin:8px auto 11px">${WEAPONS[k].name}</div>`; });
      else {
        const want = slotNames ? ['helmet', 'armor', 'boots'][i] : null;
        S.inv.filter(it => (!want || it.slot === want) && !Object.values(S.equip).includes(it.id)).sort((a, b) => b.rarity - a.rarity)
          .forEach(it => { h += `<div class="card" data-a="dput" data-v="${it.id}" style="border-color:${RARITY[it.rarity].color}">${isDisplayed(it.id) ? '<span class="tagx">전시</span>' : ''}<img src="${this.icon('gear', it.slot, it.color)}"><div style="color:${RARITY[it.rarity].color}">${it.name}</div></div>`; });
      }
      h += '</div><div class="s" style="margin-top:6px">장착 중인 장비는 전시할 수 없습니다.</div>';
    } else h += '<div class="s">칸을 눌러 전시할 물건을 고르세요.</div>';
    return [f.name + ' 진열', h];
  },
  a_dslot(d) { this.sub.pick = +d.i; this.render(); },
  a_dput(d) {
    const o = S.room.items.find(q => q.uid === this.sub.uid), v = d.v || null;
    if (v) undisplay(v);
    if (FURNITURE[o.id].slots.type === 'weapon' && v) o.disp = o.disp.map(x => x === v ? null : x);
    o.disp[this.sub.pick] = v; this.sub.pick = null; saveGame(); SFX.play('click'); this.render();
  },

  // ---------------- settings ----------------
  p_settings() {
    const h = `<div class="row"><div class="grow"><div class="t">효과음</div></div><button data-a="snd">${S.settings.sound ? '켜짐' : '꺼짐'}</button></div>
      <h3>백업 (앱을 지우면 저장이 사라집니다)</h3>
      <button data-a="export">백업 코드 만들기</button> <button data-a="import">코드로 복원</button>
      <textarea id="codeBox" placeholder="백업 코드가 여기에 표시됩니다. 복원하려면 코드를 붙여넣고 [코드로 복원]을 누르세요.">${this.sub.code || ''}</textarea>
      <h3>초기화</h3><button data-a="reset" style="border-color:var(--bad);color:var(--bad)">${this.sub.confirmReset ? '정말 초기화? 한 번 더 누르세요' : '모든 진행 초기화'}</button>`;
    return ['설정', h];
  },
  a_snd() { S.settings.sound = !S.settings.sound; saveGame(); this.render(); },
  a_export() { this.sub.code = exportCode(); this.render(); const b = $('codeBox'); b.select(); try { navigator.clipboard.writeText(this.sub.code); this.toast('백업 코드를 복사했습니다'); } catch (e) { } },
  a_import() { try { importCode($('codeBox').value); RE.hero = null; this.toast('복원 완료'); this.closeModal(); this.refreshHub(); } catch (e) { this.toast('코드가 올바르지 않습니다'); } },
  a_reset() { if (!this.sub.confirmReset) { this.sub.confirmReset = true; this.render(); return; } localStorage.removeItem(SAVE_KEY); location.reload(); },

  // ---------------- edit mode ----------------
  enterEdit() { RE.on = true; RE.placeId = null; RE.sel = null; RE.moving = false; this.show('edit'); this.refreshEdit(); },
  exitEdit() { RE.on = false; RE.placeId = null; RE.sel = null; RE.moving = false; RE.ghost = null; saveGame(); this.show('hub'); },
  refreshEdit() {
    const ids = Object.keys(S.furnInv).filter(k => S.furnInv[k] > 0);
    $('drawer').innerHTML = ids.map(id => `<div class="f ${RE.placeId === id ? 'sel' : ''}" data-f="${id}"><span class="n">${S.furnInv[id]}</span><img src="${this.furnIcon(id)}">${FURNITURE[id].name}</div>`).join('')
      + (ids.length ? '' : '<div class="empty">보관 중인 가구 없음</div>') + '<button class="shopbtn" id="bEditShop">＋ 가구 구매</button>';
    const sel = RE.sel && S.room.items.find(o => o.uid === RE.sel);
    $('selBar').classList.toggle('hidden', !sel);
    if (sel) { $('selName').textContent = FURNITURE[sel.id].name; $('bSelDisp').classList.toggle('hidden', !FURNITURE[sel.id].slots); $('bSelMove').textContent = RE.moving ? '이동할 곳을 탭' : '이동'; }
    $('editHint').textContent = RE.placeId ? `${FURNITURE[RE.placeId].name}: 놓을 곳을 탭하세요 (초록=가능)` : RE.moving ? '옮길 위치를 탭하세요' : sel ? '선택한 가구를 이동·보관·진열할 수 있습니다' : '오른쪽에서 가구를 고르거나, 배치된 가구를 탭해 선택하세요';
    $('hGrade') && this.refreshHub();
  },

  // ---------------- result / pause ----------------
  showResult(r) { this.openPanel('result', r); },
  p_result() {
    const r = this.sub;
    let h = `<div class="big2 ${r.win ? 'win' : 'lose'}">${r.win ? '임무 성공!' : '작전 실패'}</div>
      <div class="stat"><span>임무</span><b>${r.name} (Lv ${r.level})</b></div><div class="stat"><span>처치</span><b>${r.kills}</b></div><div class="stat"><span>소요 시간</span><b>${Math.floor(r.time / 60)}분 ${Math.floor(r.time % 60)}초</b></div>
      <div class="stat"><span>획득 크레딧</span><b style="color:var(--acc)">◈${fmt(r.cr)}</b></div><div class="stat"><span>획득 경험치</span><b style="color:var(--blue)">${fmt(r.xp)}</b></div>`;
    if (r.ups) h += `<div class="big2 win" style="font-size:20px">레벨 업! Lv ${S.lvl} <span class="s">(능력치 포인트 +${r.ups * 3})</span></div>`;
    if (!r.win) h += '<div class="s" style="margin-top:8px">실패하여 크레딧·경험치의 절반만 받았고, 임무 중 주운 장비는 잃었습니다.</div>';
    if (r.items.length) h += '<h3>획득 장비</h3><div class="grid">' + r.items.map(it => `<div class="card" style="border-color:${RARITY[it.rarity].color}"><img src="${this.icon('gear', it.slot, it.color)}"><div style="color:${RARITY[it.rarity].color}">${it.name}</div><div class="s">${RARITY[it.rarity].name}</div></div>`).join('') + '</div>';
    if (r.soldCr) h += `<div class="s">보관함이 가득 차 일부 장비를 자동 판매했습니다 (◈${fmt(r.soldCr)})</div>`;
    h += '<div style="text-align:center;margin-top:14px"><button class="go big" data-a="rclose">기지로 귀환</button></div>';
    return [r.win ? '작전 결과' : '작전 결과', h];
  },
  a_rclose() { const ups = this.sub.ups; this.closeModal(); Game.toHub(); if (ups) { SFX.play('levelup'); this.toast('레벨 업! [캐릭터]에서 능력치를 올리세요'); } },
  p_pause() {
    return ['일시정지', `<div style="display:flex;flex-direction:column;gap:10px"><button class="go big" data-a="resume">계속하기</button>
      <button data-a="sound2">효과음 ${S.settings.sound ? '끄기' : '켜기'}</button>
      <button data-a="abort" style="border-color:var(--bad);color:var(--bad)">${this.sub.confirm ? '정말 포기할까요? (실패 처리)' : '임무 포기'}</button></div>`];
  },
  a_resume() { this.closeModal(); Game.paused = false; },
  a_sound2() { S.settings.sound = !S.settings.sound; saveGame(); this.render(); },
  a_abort() { if (!this.sub.confirm) { this.sub.confirm = true; this.render(); return; } this.closeModal(); Game.paused = false; if (M && M.state === 'play') { M.state = 'dead'; M.endT = 0.1; } },

  p_confirmNew() {
    return ['새로 시작', `<div style="margin-bottom:14px">저장된 진행(레벨, 장비, 창고)이 모두 지워집니다. 계속할까요?</div>
      <div style="display:flex;gap:10px;justify-content:center"><button data-a="closeM">취소</button><button class="go" data-a="doNew" style="background:#a83232;border-color:#ff6b5b;color:#fff">지우고 새로 시작</button></div>`];
  },
  a_closeM() { this.closeModal(); },
  a_doNew() { this.closeModal(); newGame(); },

  // ---------------- HUD ----------------
  updateHud(m) {
    const p = m.player, w = curWeapon(m);
    $('uHp').style.width = (p.hp / p.ps.maxHp * 100) + '%';
    $('uHpT').textContent = `${Math.ceil(p.hp)} / ${p.ps.maxHp}`;
    $('uCr').textContent = fmt(m.gained.cr);
    const goals = m.goals.map(g => `<span class="${g.got >= g.need ? 'ok' : ''}">◆ ${OBJ_TYPES[g.type].name} ${g.got}/${g.need}</span>`).join(' &nbsp; ');
    const gh = goals + (m.exit.active ? ' &nbsp; <span class="exit">▶ 출구로!</span>' : '');
    if ($('uGoals')._h !== gh) { $('uGoals').innerHTML = gh; $('uGoals')._h = gh; }
    if (w) {
      const src = this.icon('weapon', w.key, w.paint);
      if ($('uWImg')._s !== src) { $('uWImg').src = src; $('uWImg')._s = src; $('uWName').textContent = WEAPONS[w.key].name + (p.weapons.length > 1 ? ' ⇄' : ''); }
      $('uAmmo').textContent = w.reloadT > 0 ? '재장전 중…' : `${w.ammo} / ${w.st.mag}`;
      $('uRl').style.width = w.reloadT > 0 ? (100 - w.reloadT / w.st.reload * 100) + '%' : '0';
    }
  },
};

// event wiring
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b && $('modal').contains(b)) { UI.act(b.dataset.a, b.dataset); return; }
  const pn = e.target.closest('[data-panel]');
  if (pn) { UI.openPanel(pn.dataset.panel); return; }
  const f = e.target.closest('.drawer .f');
  if (f) { RE.placeId = RE.placeId === f.dataset.f ? null : f.dataset.f; RE.sel = null; RE.moving = false; RE.ghost = null; SFX.play('click'); UI.refreshEdit(); return; }
  if (e.target.id === 'bEditShop') { UI.openPanel('shop', { tab: 'furn' }); }
});

// ===================================================================
// main.js - loop, scaling, input
// ===================================================================
const cv = $('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fitCanvas() {
  const s = Math.min(innerWidth / VW, innerHeight / VH);
  cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px';
  cv.style.left = (innerWidth - VW * s) / 2 + 'px'; cv.style.top = (innerHeight - VH * s) / 2 + 'px';
}
addEventListener('resize', fitCanvas); fitCanvas();
function toCanvas(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH }; }

const Game = {
  mode: 'title', paused: false, mapHeld: false,
  startMission(def) {
    SFX.init(); startMission(def); this.mode = 'mission'; this.paused = false;
    resetInput(); UI.show('hud'); UI.toast(`${def.name} — ${def.goals.map(g => OBJ_TYPES[g.type].text(g.need)).join(', ')}`, 3500);
  },
  toHub() { this.mode = 'hub'; M = null; RE.hero = null; UI.show('hub'); },
};

// ---------------- input state ----------------
const inp = { mx: 0, my: 0, aiming: false, aimAng: 0, fire: false, autoFire: 0, assist: true };
const keys = {};
let mouse = { on: false, x: 0, y: 0, down: false };
const sticks = {};
function resetInput() { Object.assign(inp, { mx: 0, my: 0, aiming: false, fire: false, autoFire: 0 }); for (const k in sticks) delete sticks[k]; $('stickL').style.display = $('stickR').style.display = 'none'; }

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (Game.mode === 'mission' && !Game.paused && M) {
    if (e.code === 'KeyR') reload(M);
    if (e.code === 'KeyQ' || e.code === 'Digit1' || e.code === 'Digit2') swapWeapon(M);
    if (e.code === 'KeyM' || e.code === 'Tab') { Game.mapHeld = true; e.preventDefault(); }
    if (e.code === 'Escape') { Game.paused = true; UI.openPanel('pause'); }
  }
});
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'KeyM' || e.code === 'Tab') Game.mapHeld = false; });

// touch twin-stick on the #touch layer
const touch = $('touch');
function stickEl(side) { return side === 'L' ? $('stickL') : $('stickR'); }
touch.addEventListener('pointerdown', e => {
  SFX.init();
  if (e.pointerType === 'mouse') { mouse.down = true; return; }
  const side = e.clientX < innerWidth * 0.45 ? 'L' : 'R';
  if (Object.values(sticks).some(s => s.side === side)) return;
  sticks[e.pointerId] = { side, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0, t0: performance.now(), moved: 0 };
  const el = stickEl(side); el.style.display = 'block'; el.style.left = e.clientX + 'px'; el.style.top = e.clientY + 'px'; el.firstChild.style.transform = '';
  touch.setPointerCapture(e.pointerId);
});
touch.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { mouse.on = true; const p = toCanvas(e); mouse.x = p.x; mouse.y = p.y; return; }
  const s = sticks[e.pointerId]; if (!s) return;
  let dx = e.clientX - s.ox, dy = e.clientY - s.oy; const d = Math.hypot(dx, dy), R = 50;
  s.moved = Math.max(s.moved, d);
  if (d > R) { dx = dx / d * R; dy = dy / d * R; }
  s.dx = dx / R; s.dy = dy / R;
  stickEl(s.side).firstChild.style.transform = `translate(${dx}px,${dy}px)`;
});
function endStick(e) {
  if (e.pointerType === 'mouse') { mouse.down = false; return; }
  const s = sticks[e.pointerId]; if (!s) return;
  if (s.side === 'R' && performance.now() - s.t0 < 250 && s.moved < 14) inp.autoFire = 0.45; // quick tap = auto-aim burst
  delete sticks[e.pointerId]; stickEl(s.side).style.display = 'none';
}
touch.addEventListener('pointerup', endStick); touch.addEventListener('pointercancel', endStick);
touch.addEventListener('contextmenu', e => e.preventDefault());

$('bMap').addEventListener('pointerdown', e => { Game.mapHeld = true; e.stopPropagation(); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => $('bMap').addEventListener(ev, () => Game.mapHeld = false));
$('bPause').addEventListener('click', () => { Game.paused = true; UI.openPanel('pause'); });
$('uWeapon').addEventListener('click', () => M && swapWeapon(M));
$('bReload').addEventListener('click', () => M && reload(M));

function readInput(dt) {
  let mx = 0, my = 0, aiming = false, ang = inp.aimAng, fire = false;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (keys.KeyW || keys.ArrowUp) my -= 1; if (keys.KeyS || keys.ArrowDown) my += 1;
  for (const id in sticks) {
    const s = sticks[id];
    if (s.side === 'L') { mx += s.dx; my += s.dy; }
    else { const d = Math.hypot(s.dx, s.dy); if (d > 0.25) { aiming = true; ang = Math.atan2(s.dy, s.dx); fire = true; } }
  }
  if (!aiming && mouse.on && M) {
    const p = M.player, cam = M.cam || { x: 0, y: 0 };
    ang = Math.atan2(mouse.y + cam.y - p.y, mouse.x + cam.x - p.x); aiming = true; fire = mouse.down;
    inp.assist = false;
  } else inp.assist = true;
  inp.mx = mx; inp.my = my; inp.aiming = aiming; inp.aimAng = ang; inp.fire = fire;
  if (inp.autoFire > 0) inp.autoFire -= dt;
}

// hub / edit pointer on canvas area
let hubPtr = null;
$('app').addEventListener('pointerdown', e => {
  SFX.init();
  if (!(Game.mode === 'hub') || !$('modal').classList.contains('hidden')) return;
  if (e.target !== cv && e.target !== $('app') && !e.target.classList.contains('screen')) return;
  hubPtr = { x: e.clientX, y: e.clientY };
});
$('app').addEventListener('pointermove', e => {
  if (Game.mode !== 'hub' || !RE.on || e.pointerType !== 'mouse') return;
  const p = toCanvas(e); roomPointer(p.x, p.y, 'move');
});
$('app').addEventListener('pointerup', e => {
  if (!hubPtr) return;
  const moved = Math.hypot(e.clientX - hubPtr.x, e.clientY - hubPtr.y); hubPtr = null;
  if (moved > 12) return;
  const p = toCanvas(e); roomPointer(p.x, p.y, 'tap');
});

// buttons
function newGame() {
  window.__demo = false; S = newSave(); refreshOffers(true); saveGame(true); SFX.init(); RE.hero = null; Game.toHub();
  UI.toast('기지에 오신 것을 환영합니다! [출격]으로 첫 임무를 시작하세요', 4000);
}
$('bNew').addEventListener('click', () => { if (window.__demo) newGame(); else UI.openPanel('confirmNew'); });
$('bContinue').addEventListener('click', () => { SFX.init(); Game.toHub(); });
$('bSettings').addEventListener('click', () => UI.openPanel('settings'));
$('bEdit').addEventListener('click', () => UI.enterEdit());
$('bEditDone').addEventListener('click', () => UI.exitEdit());
$('mClose').addEventListener('click', () => UI.closeModal());
$('modal').addEventListener('click', e => { if (e.target === $('modal') && !['result', 'pause'].includes(UI.panel)) UI.closeModal(); });
$('bSelMove').addEventListener('click', () => { RE.moving = !RE.moving; RE.placeId = null; UI.refreshEdit(); });
$('bSelStore').addEventListener('click', () => {
  const o = S.room.items.find(q => q.uid === RE.sel); if (!o) return;
  storeFurniture(RE.sel); RE.sel = null; RE.moving = false; SFX.play('click'); UI.refreshEdit();
});
$('bSelDisp').addEventListener('click', () => { if (RE.sel) UI.openDisplay(RE.sel); });
$('bSelCancel').addEventListener('click', () => { RE.sel = null; RE.moving = false; UI.refreshEdit(); });

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (Game.mode === 'mission' && M && M.state === 'play' && !Game.paused) { Game.paused = true; UI.openPanel('pause'); } SFX.suspend(true); saveGame(true); }
  else SFX.suspend(false);
});
window.__esc = () => { // Android back button
  if (!$('modal').classList.contains('hidden')) { if (UI.panel === 'pause') UI.a_resume(); else if (UI.panel !== 'result') UI.closeModal(); return; }
  if (Game.mode === 'mission') { Game.paused = true; UI.openPanel('pause'); return; }
  if (UI.screen === 'edit') { UI.exitEdit(); return; }
};

// ---------------- main loop ----------------
let last = performance.now(), clock = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
  ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.imageSmoothingEnabled = false;
  if (Game.mode === 'mission' && M) {
    readInput(dt);
    if (!Game.paused && !Game.mapHeld) updateMission(M, dt, inp);
    renderMission(ctx, M, clock);
    if (M) {
      M.cam = { x: Math.round(M.player.x) - (VW >> 1), y: Math.round(M.player.y) - (VH >> 1) };
      if (Game.mapHeld) renderMinimap(ctx, M, clock);
      UI.updateHud(M);
    }
  } else if (S) {
    updateRoom(dt); renderRoom(ctx, clock);
  } else {
    ctx.fillStyle = '#0b0c12'; ctx.fillRect(0, 0, VW, VH);
  }
  requestAnimationFrame(frame);
}

// ---------------- boot ----------------
// iOS Safari: block pinch / double-tap zoom and rubber-band scrolling
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('touchmove', e => { if (!e.target.closest('.body, .drawer, textarea')) e.preventDefault(); }, { passive: false });
addEventListener('orientationchange', () => setTimeout(fitCanvas, 300));
addEventListener('pageshow', () => { fitCanvas(); SFX.suspend(false); });
// offline support when served as a PWA (service worker file present)
if (window.__PWA__ && 'serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => { });

(function boot() {
  const has = loadGame();
  if (!has) { $('bContinue').classList.add('hidden'); $('bNew').classList.remove('ghost'); S = null; }
  if (has) refreshOffers();
  // title backdrop: show a demo room if there is no save
  if (!S) { S = newSave(); window.__demo = true; }
  UI.show('title');
  requestAnimationFrame(frame);
})();

</script>
</body>
