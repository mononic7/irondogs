<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0c12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="아이언 독스">
<meta name="format-detection" content="telephone=no">
<script>window.__PWA__=true;</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>아이언 독스</title>
<style>
:root { --bg: #0b0c12; --panel: #161925; --panel2: #1f2333; --line: #2e3448; --txt: #e6e8f0; --dim: #8d93a8; --acc: #ffcc33; --good: #6fdc6f; --bad: #ff6b5b; --blue: #6fa8ff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); overflow: hidden; touch-action: none;
  font-family: "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
html, body { overscroll-behavior: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
* { -webkit-touch-callout: none; }
#app { position: fixed; inset: 0; }
#rotate { position: fixed; inset: 0; z-index: 100; background: #0b0c12; display: none; align-items: center; justify-content: center; text-align: center; font-size: 18px; color: var(--txt); }
#rotate .ph { font-size: 48px; margin-bottom: 10px; transform: rotate(90deg); }
@media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
#cv { position: absolute; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; image-rendering: pixelated; background: #000; }
button { touch-action: manipulation; font: inherit; color: var(--txt); background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
button:active { transform: translateY(1px); filter: brightness(1.2); }
button:disabled { opacity: .4; }
button.go { background: #c8961c; border-color: #ffcc33; color: #1a1300; }
button.ghost { background: transparent; }
button.icon { width: 38px; height: 38px; padding: 0; font-size: 18px; }
button.small { padding: 5px 9px; font-size: 12px; border-radius: 7px; }
.hidden { display: none !important; }
.screen { position: absolute; inset: 0; display: none; pointer-events: none; }
.screen.on { display: block; }
.screen > * { pointer-events: auto; }

/* title */
#title { background: radial-gradient(ellipse at center, rgba(11,12,18,.35), rgba(11,12,18,.9)); text-align: center; }
#title.on { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.logo { font-size: clamp(38px, 9vw, 72px); font-weight: 900; letter-spacing: 6px; color: var(--acc); text-shadow: 4px 4px 0 #6b3d00, 0 0 24px rgba(255,190,40,.35); line-height: 1; }
.logo small { display: block; font-size: .32em; letter-spacing: 10px; color: #fff; text-shadow: 2px 2px 0 #000; margin-top: 8px; }
.tag { color: var(--dim); font-size: 14px; }
.col { display: flex; gap: 12px; }
button.big { font-size: 18px; padding: 12px 30px; border-radius: 12px; }
.foot { position: absolute; bottom: 10px; left: 0; right: 0; color: #5d6378; font-size: 11px; }

/* bars */
.topbar { position: absolute; top: max(6px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); display: flex; gap: 8px; align-items: center; }
.chip { background: rgba(22,25,37,.9); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.chip.cr b { color: var(--acc); }
.chip.grade { color: #ffd98a; }
.chip .bar { width: 90px; height: 7px; background: #0b0c12; border-radius: 4px; overflow: hidden; }
.chip .bar i { display: block; height: 100%; background: linear-gradient(90deg, #4fa8ff, #8ad8ff); width: 0; }
.dot { background: var(--bad); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; font-weight: 900; }
.topbar .icon { margin-left: auto; }
.bottombar { position: absolute; bottom: max(6px, env(safe-area-inset-bottom)); left: 0; right: 0; display: flex; justify-content: center; gap: 8px; padding: 0 8px; }
.bottombar button { min-width: 72px; padding: 9px 12px; background: rgba(31,35,51,.93); }
.bottombar button.go { min-width: 96px; background: #c8961c; }
input, textarea { -webkit-user-select: text; user-select: text; }
input[type=text] { font: inherit; color: var(--txt); background: #0b0c12; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }

/* edit */
.hint { background: rgba(22,25,37,.92); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 13px; flex: 1; }
.drawer { position: absolute; top: 54px; bottom: max(6px, env(safe-area-inset-bottom)); right: max(6px, env(safe-area-inset-right)); width: 92px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding: 6px; background: rgba(22,25,37,.92); border: 1px solid var(--line); border-radius: 12px; touch-action: pan-y; }
.drawer .f { flex: 0 0 auto; padding: 4px; text-align: center; font-size: 11px; border-radius: 9px; background: var(--panel2); border: 2px solid transparent; position: relative; }
.drawer .f.sel { border-color: var(--acc); }
.drawer .f img { height: 30px; max-width: 100%; image-rendering: pixelated; display: block; margin: 0 auto 2px; }
.drawer .f .n { position: absolute; top: 2px; right: 4px; color: var(--acc); font-weight: 900; }
.drawer .shopbtn { flex: 0 0 auto; padding: 6px 2px; font-size: 12px; }
.drawer .empty { color: var(--dim); font-size: 11px; text-align: center; padding: 4px; }
.selbar { position: absolute; left: 50%; transform: translateX(-50%); top: 52px; display: flex; gap: 6px; align-items: center; background: rgba(22,25,37,.95); border: 1px solid var(--acc); border-radius: 12px; padding: 6px 8px; font-size: 13px; }
.selbar span { padding: 0 6px; font-weight: 700; }

/* HUD */
.hp { position: absolute; top: max(8px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; text-shadow: 1px 1px 0 #000; }
.hpbar { width: 150px; height: 12px; background: rgba(0,0,0,.6); border: 1px solid #000; border-radius: 3px; overflow: hidden; }
.hpbar i { display: block; height: 100%; background: linear-gradient(#ff7a6b, #c0392b); }
.goals { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: 12px; text-shadow: 1px 1px 0 #000; background: rgba(0,0,0,.35); padding: 4px 10px; border-radius: 8px; white-space: nowrap; pointer-events: none !important; }
.goals .ok { color: var(--good); }
.goals .exit { color: #4fe08a; font-weight: 900; }
.hudbtns { position: absolute; top: max(6px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); display: flex; gap: 6px; }
.hudbtns button { padding: 6px 12px; background: rgba(22,25,37,.75); }
.weapon { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 52px; display: flex; gap: 8px; align-items: center; background: rgba(22,25,37,.75); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 12px; }
.weapon img { width: 48px; image-rendering: pixelated; }
.weapon b { display: block; font-size: 12px; }
.weapon .rl { height: 3px; background: #000; margin-top: 3px; width: 70px; }
.weapon .rl i { display: block; height: 100%; width: 0; background: var(--acc); }
.reload { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 108px; background: rgba(22,25,37,.75); font-size: 12px; padding: 6px 10px; }
.supplies { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 146px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.nade { background: rgba(22,25,37,.75); font-size: 13px; font-weight: 700; padding: 6px 10px; display: flex; align-items: center; gap: 6px; }
.nade i { width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #8a9a6a, #4f6236 55%, #1c2414); box-shadow: 0 -3px 0 -1px #b0b0b8; }
.nade.empty { opacity: .45; }
.modrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.modchip { font-size: 11px; padding: 3px 7px; display: inline-flex; align-items: center; gap: 4px; }
.modbadge { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border: 2px solid; border-radius: 5px; font-style: normal; font-size: 11px; color: #fff; flex: none; }
.row > .modbadge { width: 40px; height: 40px; font-size: 20px; }
#bFlash i { border-radius: 3px; width: 9px; background: linear-gradient(#9aa0ac 0 40%, #e8eef8 40% 60%, #9aa0ac 60%); box-shadow: 0 -3px 0 -1px #d0d6e0; }
#bFlare i { border-radius: 2px; width: 6px; height: 13px; background: linear-gradient(#fff2d8 0 20%, #e8442c 20%); box-shadow: 0 0 6px 1px rgba(255,120,60,.8); }
#bMine i { width: 14px; height: 9px; border-radius: 50%; background: radial-gradient(circle, #ff3b30 0 18%, #4c4f3a 22% 70%, #1b1c16 72%); box-shadow: none; }
#bMed i { width: 12px; height: 12px; border-radius: 2px; background: linear-gradient(#e74c3c, #e74c3c) center/3px 9px no-repeat, linear-gradient(#e74c3c, #e74c3c) center/9px 3px no-repeat, #f2f2f2; box-shadow: none; }
.nade { touch-action: none; }
.nade.aim { border-color: #ffb070; background: rgba(90,40,20,.85); }
.nade.cancel { border-color: var(--bad); opacity: .7; }
.bossbar { position: absolute; top: 38px; left: 50%; transform: translateX(-50%); width: min(46%, 380px); text-align: center; pointer-events: none !important; }
.bossbar b { font-size: 12px; color: #ffb090; text-shadow: 1px 1px 0 #000; letter-spacing: 1px; }
.bossbar .bb { height: 7px; background: rgba(0,0,0,.7); border: 1px solid #5a2a20; border-radius: 4px; overflow: hidden; margin-top: 2px; }
.bossbar .bb i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #c0392b, #ff7a3a); transition: width .15s; }
.radio { position: absolute; left: max(10px, env(safe-area-inset-left)); top: 54px; max-width: min(46%, 360px); background: rgba(8,12,18,.88); border: 1px solid #2c4a5a; border-left: 3px solid #7fd0ff; border-radius: 8px; padding: 6px 10px; font-size: 12px; line-height: 1.45; pointer-events: none !important; animation: tin .2s ease-out; }
.radio b { display: block; font-size: 11px; letter-spacing: 1px; margin-bottom: 1px; }
.radio b::before { content: '◉ '; font-size: 9px; }
.ctabs { display: flex; gap: 6px; margin-bottom: 10px; }
.cregions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.cregions button { flex: 1; min-width: 92px; font-size: 12px; padding: 6px 4px; line-height: 1.3; }
.cregions button.on { border-color: var(--acc); color: var(--acc); }
.cmap { display: flex; align-items: center; margin: 14px 4px 6px; }
.cmap .cline { flex: 1; height: 3px; background: #2a2e3d; min-width: 8px; }
.cmap .cline.on { background: var(--acc); }
.cnode { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #3a3e4f; background: #161924; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; padding: 0; flex: none; position: relative; }
.cnode.done { border-color: var(--acc); }
.cnode.open { border-color: #7fd0ff; box-shadow: 0 0 10px rgba(127,208,255,.45); }
.cnode.boss { width: 56px; height: 56px; border-color: #c0392b; font-size: 18px; }
.cnode.sel { outline: 2px solid #fff; outline-offset: 2px; }
.cnode.lock { opacity: .4; }
.cnode .st { position: absolute; bottom: -15px; font-size: 10px; color: var(--acc); white-space: nowrap; letter-spacing: -1px; }
.cline-txt { border-left: 3px solid #2c4a5a; padding: 3px 8px; margin: 4px 0; font-size: 12px; line-height: 1.5; }
.cline-txt b { font-size: 11px; display: block; }
.cstar { font-size: 12px; margin: 2px 0; }
.cstar.ok { color: var(--acc); }
.credits { position: absolute; left: max(10px, env(safe-area-inset-left)); top: 30px; font-size: 12px; color: var(--acc); font-weight: 700; text-shadow: 1px 1px 0 #000; pointer-events: none !important; }
#cv3 { position: absolute; display: none; background: #000; }
.firebtn { position: absolute; display: none; right: max(92px, calc(env(safe-area-inset-right) + 82px)); bottom: max(22px, env(safe-area-inset-bottom)); width: 78px; height: 78px; border-radius: 50%; padding: 0; font-size: 14px; background: rgba(170,50,35,.55); border: 2px solid rgba(255,140,120,.7); touch-action: none; }
#touch { position: absolute; inset: 0; display: none; }
#touch.on { display: block; }
.stick { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.06); display: none; pointer-events: none; }
.stick.aim { border-color: rgba(255,110,90,.5); }
.stick .knob { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.35); }
.stick.aim .knob { background: rgba(255,110,90,.55); }
.stick.nadering { width: 140px; height: 140px; margin: -70px 0 0 -70px; border: 1.5px solid rgba(255,176,112,.5); background: none; z-index: 5; }
.stick.nadering .knob { left: 54px; top: 54px; width: 30px; height: 30px; background: rgba(255,176,112,.35); border: 1.5px solid rgba(255,220,180,.7); }
.stick.nadering.off { opacity: .45; }

/* modal sheet */
.modal { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; justify-content: flex-end; }
.modal.center { justify-content: center; align-items: center; }
.sheet { width: min(620px, 74vw); height: 100%; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.modal.center .sheet { height: auto; max-height: 92%; border: 1px solid var(--line); border-radius: 14px; width: min(560px, 92vw); }
.sheet header { display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); gap: 10px; }
.sheet h2 { margin: 0; font-size: 17px; flex: 1; }
.body { padding: 12px; overflow-y: auto; flex: 1; touch-action: pan-y; font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
.row img { image-rendering: pixelated; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 700; font-size: 14px; }
.row .s { color: var(--dim); font-size: 12px; margin-top: 2px; }
.row.selected { border-color: var(--acc); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tabs button.on { background: #3a3220; border-color: var(--acc); color: var(--acc); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.card { background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 6px 4px; text-align: center; font-size: 11px; position: relative; }
.card img { width: 48px; height: 48px; image-rendering: pixelated; display: block; margin: 0 auto 3px; }
.card .tagx { position: absolute; top: 2px; left: 4px; font-size: 10px; color: var(--acc); }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.slot { background: #10131c; border: 2px dashed var(--line); border-radius: 10px; padding: 6px; text-align: center; font-size: 11px; min-height: 86px; }
.slot img { width: 44px; height: 44px; image-rendering: pixelated; display: block; margin: 0 auto 2px; }
.stat { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #2a2f40; }
.stat b { color: var(--txt); }
.up { color: var(--good); } .down { color: var(--bad); }
.sw { display: inline-block; width: 26px; height: 26px; border-radius: 6px; border: 2px solid #000; margin: 2px; vertical-align: middle; cursor: pointer; }
.sw.on { outline: 2px solid var(--acc); }
h3 { font-size: 13px; color: var(--dim); margin: 14px 0 6px; font-weight: 700; }
.big2 { font-size: 26px; font-weight: 900; text-align: center; margin: 4px 0 10px; }
.win { color: var(--acc); } .lose { color: var(--bad); }
textarea { width: 100%; height: 80px; background: #0b0c12; color: var(--txt); border: 1px solid var(--line); border-radius: 8px; font-size: 11px; padding: 6px; -webkit-user-select: text; user-select: text; }
#toasts { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 50; }
.toast { background: rgba(14,15,22,.92); border: 1px solid var(--line); border-radius: 10px; padding: 7px 14px; font-size: 13px; animation: tin .2s ease-out; }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } }

</style>
</head>
<body>
<div id="app">
  <canvas id="cv3"></canvas>
  <canvas id="cv" width="800" height="450"></canvas>
  <div id="touch"></div>
  <div class="stick" id="stickL"><div class="knob"></div></div>
  <div class="stick aim" id="stickR"><div class="knob"></div></div>
  <div class="stick nadering" id="stickN"><div class="knob"></div></div>

  <!-- title -->
  <section id="title" class="screen">
    <div class="logo">IRON DOGS<small>아이언 독스</small></div>
    <div class="tag">돌연변이 기지를 소탕하고, 성장하고, 나만의 무기고를 꾸미자</div>
    <div class="col">
      <button class="big" id="bContinue">이어하기</button>
      <button class="big ghost" id="bNew">새로 시작</button>
    </div>
    <div class="foot">Cyberdogs(1994, Ronny Wester)의 공개 소스에서 영감을 받은 리메이크 · 모든 그래픽 새로 제작</div>
  </section>

  <!-- hub (armory) -->
  <section id="hub" class="screen">
    <div class="topbar">
      <div class="chip lv"><b id="hLv">Lv 1</b><div class="bar"><i id="hXp"></i></div><span id="hPts" class="dot hidden">!</span></div>
      <div class="chip cr">◈ <b id="hCr">0</b></div>
      <div class="chip grade" id="hGrade">창고 ★</div>
      <button class="icon" id="bSettings" title="설정">⚙</button>
    </div>
    <div class="bottombar">
      <button class="go" data-panel="missions">▶ 출격</button>
      <button data-panel="char">캐릭터</button>
      <button data-panel="dog">군견</button>
      <button data-panel="weapons">무기</button>
      <button data-panel="gear">장비</button>
      <button data-panel="shop">상점</button>
      <button id="bEdit">꾸미기</button>
    </div>
  </section>

  <!-- decorate mode -->
  <section id="edit" class="screen">
    <div class="topbar">
      <div class="hint" id="editHint">오른쪽에서 가구를 골라 바닥을 탭하면 배치됩니다</div>
      <button class="go" id="bEditDone">완료</button>
    </div>
    <div class="selbar hidden" id="selBar">
      <span id="selName"></span>
      <button id="bSelMove">이동</button>
      <button id="bSelDisp">진열</button>
      <button id="bSelStore">보관</button>
      <button id="bSelCancel">✕</button>
    </div>
    <div class="drawer" id="drawer"></div>
  </section>

  <!-- mission HUD -->
  <section id="hud" class="screen">
    <div class="hp"><div class="hpbar"><i id="uHp"></i></div><span id="uHpT"></span></div>
    <div class="goals" id="uGoals"></div>
    <div class="hudbtns"><button id="bMap">지도</button><button id="bPause">Ⅱ</button></div>
    <div class="weapon" id="uWeapon"><img id="uWImg"><div><b id="uWName"></b><span id="uAmmo"></span><div class="rl"><i id="uRl"></i></div></div></div>
    <button class="reload" id="bReload">재장전</button>
    <button class="firebtn" id="bFire">발사</button>
    <div class="supplies">
      <button class="nade" id="bNade" data-k="grenade"><i></i><span id="uNade">0</span></button>
      <button class="nade" id="bFlash" data-k="flash"><i></i><span>0</span></button>
      <button class="nade" id="bFlare" data-k="flare"><i></i><span>0</span></button>
      <button class="nade" id="bMine" data-k="mine"><i></i><span>0</span></button>
      <button class="nade" id="bMed" data-k="medkit"><i></i><span>0</span></button>
    </div>
    <div class="credits">◈ <span id="uCr">0</span></div>
    <div class="bossbar hidden" id="bossBar"><b id="bossName"></b><div class="bb"><i id="bossHp"></i></div></div>
    <div class="radio hidden" id="radio"><b id="radioWho"></b><span id="radioText"></span></div>
  </section>

  <div id="modal" class="modal hidden"><div class="sheet"><header><h2 id="mTitle"></h2><button class="icon" id="mClose">✕</button></header><div class="body" id="mBody"></div></div></div>
  <div id="toasts"></div>
  <div id="rotate"><div><div class="ph">📱</div>화면을 <b>가로</b>로 돌려 주세요</div></div>
</div>
<script>
/**

function hexToRgb(h) { const v = parseInt(h.slice(1), 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; }
function rgbToHex(r, g, b) { return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }

// ---------- tiny pixel digits (3x5) for damage numbers ----------
const DIGITS = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111',
  '+': '000010111010000', '-': '000000111000000'
};
function drawDigits(ctx, str, x, y, col) {
  ctx.fillStyle = '#000';
  for (let pass = 0; pass < 2; pass++) {
    let cx = x;
    for (const ch of str) {
      const p = DIGITS[ch];
      if (p) for (let i = 0; i < 15; i++) if (p[i] === '1') ctx.fillRect(cx + i % 3 + (pass ? 0 : 1), y + (i / 3 | 0) + (pass ? 0 : 1), 1, 1);
      cx += 4;
    }
    ctx.fillStyle = col;
  }
}

let _uid = Date.now() % 100000;
function newId(p) { return (p || 'i') + (++_uid).toString(36) + Math.floor(Math.random() * 1296).toString(36); }

function rollRarity(level, bonus) {
  const r = Math.random() * 100 - (bonus || 0) - level * 0.8;
  if (r < 2) return 4; if (r < 9) return 3; if (r < 24) return 2; if (r < 52) return 1; return 0;
}
function makeGear(level, rarity, slot) {
  slot = slot || Object.keys(GEAR_SLOTS)[Math.random() * 4 | 0];
  if (rarity === undefined) rarity = rollRarity(level);
  const pool = GEAR_POOL[slot].slice(), stats = {};
  const n = Math.min(pool.length, 1 + Math.ceil(rarity / 1.5));
  for (let i = 0; i < n; i++) {
    const st = pool.splice(Math.random() * pool.length | 0, 1)[0];
    const pts = (1.5 + Math.random() * 1.5) * (1 + level * 0.18) * RARITY[rarity].mul;
    let v = pts * STAT_PER[st];
    v = st === 'regen' ? Math.round(v * 10) / 10 : Math.max(1, Math.round(v));
    stats[st] = v;
  }
  const bases = GEAR_BASES[slot];
  return {
    id: newId('g'), slot, rarity, level, stats,
    name: bases[Math.min(bases.length - 1, Math.floor(Math.random() * (1 + rarity)))],
    color: PAINTS[Math.random() * PAINTS.length | 0],
  };
}

const MISSION_NAMES = ['검은 항구', '폐쇄 구역 7', '유령 연구동', '붉은 용광로', '지하 보급창', '침묵의 탑', '녹슨 격납고', '얼어붙은 터널', '심연 실험실', '최전선 벙커'];
function makeMission(level, seed) {
  const r = rnd32(seed);
  const types = ['kill', 'collect', 'destroy'];
  const objs = [];
  const first = types[r() * 3 | 0];
  objs.push(first);
  if (level >= 4 && r() < 0.6) { const t2 = types.filter(t => t !== first)[r() * 2 | 0]; objs.push(t2); }
  const goals = objs.map(t => ({ type: t, need: t === 'kill' ? 8 + level * 2 : t === 'collect' ? 3 + Math.min(4, level / 3 | 0) : 2 + Math.min(3, level / 4 | 0), got: 0 }));
  const def = {
    seed, level, theme: r() * MISSION_THEMES.length | 0,
    name: MISSION_NAMES[r() * MISSION_NAMES.length | 0],
    ...(r() < FIELD_CHANCE ? { kind: 'field', name: FIELD_NAMES[r() * FIELD_NAMES.length | 0] } : {}),
    goals, rewardCr: 250 + level * 160, rewardXp: 70 + level * 45,
  };
  if (level >= INTERACT.nightLvl && r() < INTERACT.nightChance) { def.night = true; def.rewardCr = Math.round(def.rewardCr * 1.15); }
  if (def.kind === 'field') { const w = r(); if (w < INTERACT.rainChance) def.weather = 'rain'; else if (w < INTERACT.rainChance + INTERACT.fogChance) def.weather = 'fog'; }
  return def;
}

const GRADE_STEPS = [0, 10, 25, 45, 70, 100, 140];

    ctx.fillStyle = tt === TILE_WALL ? (m.field ? (m.deco[k] === W_BLD ? '#8b8478' : '#16331a') : '#59607a') : tt === TILE_CRATE ? '#6e4b2a' : tt === TILE_GEN ? '#ff5544' : tt === TILE_BARREL ? '#d04020' : tt === TILE_DOOR ? '#e0b020' : tt === TILE_ALARM ? ((t * 3 | 0) % 2 && m.alarm && m.alarm.on ? '#ffffff' : '#ff3060') : m.field ? '#46573a' : '#1f2230';
    ctx.fillRect(ox + i * s, oy + j * s, s, s);
  }
  m.gens.forEach(g => { ctx.fillStyle = '#ff5544'; ctx.fillRect(ox + g.tx * s, oy + g.ty * s, s, s); });
  m.pickups.forEach(o => { if (o.type === 'disk') { ctx.fillStyle = '#8ab8ff'; ctx.fillRect(ox + (o.x >> 4) * s + 1, oy + (o.y >> 4) * s + 1, 3, 3); } });
  if (m.boss && m.boss.announced && m.enemies.includes(m.boss)) { ctx.fillStyle = (t * 4 | 0) % 2 ? '#ff4030' : '#ffd34a'; ctx.fillRect(ox + (m.boss.x / T) * s - 3, oy + (m.boss.y / T) * s - 3, 6, 6); }
  if (m.unique && m.unique.announced && m.enemies.includes(m.unique)) { ctx.fillStyle = '#ffb020'; ctx.fillRect(ox + (m.unique.x / T) * s - 2, oy + (m.unique.y / T) * s - 2, 4, 4); }
  ctx.fillStyle = m.exit.active ? '#4fe08a' : '#2a6a40'; ctx.fillRect(ox + m.exit.tx * s - 1, oy + m.exit.ty * s - 1, s + 2, s + 2);
  m.pickups.forEach(o => { if (o.type === 'key' && m.explored[(o.y >> 4) * m.W + (o.x >> 4)]) { ctx.fillStyle = '#ffd34a'; ctx.fillRect(ox + (o.x >> 4) * s, oy + (o.y >> 4) * s, s, s); } });
  if (m.dog && !m.dog.hidden) { ctx.fillStyle = '#d8a23a'; ctx.fillRect(ox + (m.dog.x / T) * s - 1.5, oy + (m.dog.y / T) * s - 1.5, 3, 3); m.dog.sensed.forEach(e => { if (m.enemies.includes(e)) { ctx.fillStyle = '#ff9a3a'; ctx.fillRect(ox + (e.x / T) * s - 1.5, oy + (e.y / T) * s - 1.5, 3, 3); } }); }
  if (m.allies) m.allies.forEach(e => { ctx.fillStyle = '#3fb8ff'; ctx.fillRect(ox + (e.x / T) * s - 2, oy + (e.y / T) * s - 2, 4, 4); });
  if ((t * 3 | 0) % 2 && !m.player.dead) { ctx.fillStyle = '#ffffff'; ctx.fillRect(ox + (m.player.x / T) * s - 2, oy + (m.player.y / T) * s - 2, 4, 4); }
}

// ===================================================================
// field.js - ground (field) missions: open outdoor map, helicopter drop-in and pickup
//   start : the helicopter flies in, lands on the start pad and drops the player off
//   end   : after all objectives, walk to the landing zone (H) -> the helicopter is called,
//           enemy reinforcements attack while it is inbound (HELI_ETA s) -> board it to win
// ===================================================================
const FIELD_W = 64, FIELD_H = 44;
const G_GRASS = 0, G_DIRT = 1, G_CONC = 2;            // ground kinds (deco of floor tiles)
const W_TREE = 0, W_ROCK = 1, W_BLD = 2;               // wall kinds (deco of wall tiles)
const FIELD_THEME = { name: '지상 작전', field: true, floor: ['#3f5f2f', '#304a24', '#52733f'], wall: ['#8b8478', '#6e685e', '#4d483f', '#a8a196'], style: 'ruin', fog: '#060a07' };

// ---------------- map ----------------
function genField(def) {
  const r = rnd32(def.seed * 13 + 5), W = FIELD_W, H = FIELD_H;
  const tiles = new Uint8Array(W * H).fill(TILE_FLOOR), deco = new Uint8Array(W * H), keep = new Uint8Array(W * H), res = new Uint8Array(W * H);
  const inMap = (i, j) => i >= 0 && j >= 0 && i < W && j < H;
  const set = (i, j, t, d) => { if (inMap(i, j)) { tiles[j * W + i] = t; deco[j * W + i] = d; } };
  // landing pads on the left and right edge
  const sy = 8 + (r() * (H - 16) | 0), ey = 8 + (r() * (H - 16) | 0);
  const start = { x: 4, y: sy - 3, w: 7, h: 7, cx: 7, cy: sy }, exitZ = { x: W - 11, y: ey - 3, w: 7, h: 7, cx: W - 8, cy: ey };
  [start, exitZ].forEach(z => {
    for (let j = z.cy - 5; j <= z.cy + 5; j++) for (let i = z.cx - 5; i <= z.cx + 5; i++) if (inMap(i, j) && (i - z.cx) ** 2 + (j - z.cy) ** 2 <= 27) { res[j * W + i] = 1; if ((i - z.cx) ** 2 + (j - z.cy) ** 2 <= 8) keep[j * W + i] = 1; }
  });
  // dirt road from pad to pad
  let y = sy;
  for (let x = 2; x <= W - 3; x++) {
    const want = sy + (ey - sy) * (x - 2) / (W - 5), oy = y;
    if (r() < 0.35) y += Math.sign(Math.round(want + (r() - 0.5) * 8) - y);
    y = Math.max(4, Math.min(H - 6, y));
    for (const yy of [oy, y, y + 1]) { if (inMap(x, yy)) { deco[yy * W + x] = G_DIRT; res[yy * W + x] = 1; } }
  }
  // ruined buildings
  const blds = [];
  for (let a = 0; a < 120 && blds.length < 7; a++) {
    const w = 6 + (r() * 5 | 0), h = 5 + (r() * 4 | 0), x = 4 + (r() * (W - w - 8) | 0), yy = 4 + (r() * (H - h - 8) | 0);
    let ok = !blds.some(o => x < o.x + o.w + 3 && x + w + 3 > o.x && yy < o.y + o.h + 3 && yy + h + 3 > o.y);
    for (let j = yy - 1; ok && j <= yy + h; j++) for (let i = x - 1; i <= x + w; i++) if (res[j * W + i]) { ok = false; break; }
    if (!ok) continue;
    for (let j = yy - 1; j <= yy + h; j++) for (let i = x - 1; i <= x + w; i++) {
      res[j * W + i] = 1;
      const edge = i === x || j === yy || i === x + w - 1 || j === yy + h - 1, inside = i >= x && j >= yy && i < x + w && j < yy + h;
      if (inside) set(i, j, edge ? TILE_WALL : TILE_FLOOR, edge ? W_BLD : G_CONC);
    }
    // doorways (2 wide) and a few holes in the walls
    const doors = 1 + (r() < 0.6 ? 1 : 0);
    for (let d = 0; d < doors; d++) {
      const side = r() * 4 | 0;
      if (side < 2) { const i = x + 2 + (r() * (w - 5) | 0), j = side ? yy + h - 1 : yy; set(i, j, TILE_FLOOR, G_CONC); set(i + 1, j, TILE_FLOOR, G_CONC); }
      else { const j = yy + 2 + (r() * (h - 5) | 0), i = side === 2 ? x : x + w - 1; set(i, j, TILE_FLOOR, G_CONC); set(i, j + 1, TILE_FLOOR, G_CONC); }
    }
    for (let k = 0; k < 2; k++) if (r() < 0.5) { const i = x + 1 + (r() * (w - 2) | 0); set(i, r() < 0.5 ? yy : yy + h - 1, TILE_FLOOR, G_DIRT); }
    blds.push({ x, y: yy, w, h });
  }
  // forests, rocks and dirt patches
  const blob = (cx, cy, rad, fn) => { for (let j = Math.floor(cy - rad); j <= cy + rad; j++) for (let i = Math.floor(cx - rad); i <= cx + rad; i++) if (inMap(i, j) && (i - cx) ** 2 + (j - cy) ** 2 <= rad * rad) fn(i, j); };
  const nForest = 12 + (r() * 5 | 0);
  for (let k = 0; k < nForest; k++) {
    const rad = 1.6 + r() * 3;
    blob(2 + r() * (W - 4), 2 + r() * (H - 4), rad, (i, j) => { if (!res[j * W + i] && noiseAt(i, j, def.seed % 977) < 0.82) set(i, j, TILE_WALL, W_TREE); });
  }
  for (let k = 0; k < 30; k++) { const i = 3 + (r() * (W - 6) | 0), j = 3 + (r() * (H - 6) | 0); if (!res[j * W + i] && tiles[j * W + i] === TILE_FLOOR) set(i, j, TILE_WALL, r() < 0.55 ? W_ROCK : W_TREE); }
  for (let k = 0; k < 9; k++) blob(r() * W, r() * H, 1 + r() * 2.5, (i, j) => { if (tiles[j * W + i] === TILE_FLOOR && deco[j * W + i] === G_GRASS && noiseAt(i, j, 77) < 0.75) deco[j * W + i] = G_DIRT; });
  // treeline around the map
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) if (i < 2 || j < 2 || i >= W - 2 || j >= H - 2) set(i, j, TILE_WALL, W_TREE);
  // everything must be reachable from the start pad: fill pockets with trees
  const dist = bfs(tiles, W, H, start.cx, start.cy);
  for (let k = 0; k < W * H; k++) if (tiles[k] === TILE_FLOOR && dist[k] < 0) { tiles[k] = TILE_WALL; deco[k] = W_TREE; }
  // placement zones: building interiors + a coarse grid (not next to the start pad)
  const rooms = [start];
  blds.filter(b => Math.hypot(b.x + b.w / 2 - start.cx, b.y + b.h / 2 - start.cy) > 12).forEach(b => rooms.push({ x: b.x + 1, y: b.y + 1, w: b.w - 2, h: b.h - 2, cx: b.x + (b.w >> 1), cy: b.y + (b.h >> 1), bld: true }));
  const cw = (W - 4) / 4, ch = (H - 4) / 3;
  for (let gy = 0; gy < 3; gy++) for (let gx = 0; gx < 4; gx++) {
    const z = { x: 2 + Math.round(gx * cw), y: 2 + Math.round(gy * ch), w: Math.round(cw), h: Math.round(ch) };
    z.cx = z.x + (z.w >> 1); z.cy = z.y + (z.h >> 1);
    if (Math.hypot(z.cx - start.cx, z.cy - start.cy) > 15) rooms.push(z);
  }
  return { W, H, tiles, deco, keep, rooms, start, exitRoom: exitZ, r, field: true };
}

// ---------------- background (fine 32px tiles) ----------------
function fieldBackground(m, bx) {
  const { W, H, tiles, deco } = m;
  const wallAt = (i, j) => i < 0 || j < 0 || i >= W || j >= H || tiles[j * W + i] === TILE_WALL;
  const bldAt = (i, j) => i >= 0 && j >= 0 && i < W && j < H && tiles[j * W + i] === TILE_WALL && deco[j * W + i] === W_BLD;
  const groundAt = (i, j) => (i < 0 || j < 0 || i >= W || j >= H) ? G_GRASS : tiles[j * W + i] === TILE_WALL ? (deco[j * W + i] === W_BLD ? G_CONC : G_GRASS) : deco[j * W + i];
  // ground
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const x = i * FT, y = j * FT, g = groundAt(i, j);
    if (bldAt(i, j)) continue;
    if (g === G_DIRT) {
      px1(bx, x, y, FT, FT, noiseAt(i, j, 3) < 0.5 ? '#6e5b3f' : '#685539');
      for (let k = 0; k < 9; k++) { const n = noiseAt(i, j, k + 40); px1(bx, x + (noiseAt(i + k, j, 9) * 30 | 0), y + (noiseAt(i, j + k, 11) * 30 | 0), 2, n < 0.4 ? 2 : 1, n < 0.5 ? '#8a7656' : '#56452e'); }
      // grass fringe toward grass neighbours
      const fr = (cond, fx, fy, w, h) => { if (cond) for (let k = 0; k < 8; k++) { const o = noiseAt(i * 7 + k, j * 3, 21) * 28 | 0; px1(bx, x + fx(o), y + fy(o), w, h, k % 2 ? '#3f5f2f' : '#47693a'); } };
      fr(groundAt(i, j - 1) === G_GRASS, o => o, () => 0, 3, 2 + (noiseAt(i, j, 5) * 3 | 0));
      fr(groundAt(i, j + 1) === G_GRASS, o => o, () => FT - 3, 3, 3);
      fr(groundAt(i - 1, j) === G_GRASS, () => 0, o => o, 3, 3);
      fr(groundAt(i + 1, j) === G_GRASS, () => FT - 3, o => o, 3, 3);
    } else if (g === G_CONC) {
      px1(bx, x, y, FT, FT, '#5d5f61');
      px1(bx, x, y, FT, 1, '#6c6e70'); px1(bx, x, y + FT - 1, FT, 1, '#4a4c4e'); px1(bx, x + FT - 1, y, 1, FT, '#4a4c4e');
      if (noiseAt(i, j, 8) < 0.35) for (let k = 0, cx = 4 + (noiseAt(i, j, 2) * 20 | 0), cy = 3; k < 9; k++) { px1(bx, x + cx, y + cy, 1, 3, '#3e4042'); cx += noiseAt(i, k, j) < 0.5 ? 1 : -1; cy += 3; if (cy > FT - 3) break; }
      if (noiseAt(i, j, 6) < 0.3) px1(bx, x + 6 + (noiseAt(i, j, 1) * 18 | 0), y + 8 + (noiseAt(j, i, 1) * 14 | 0), 4, 3, '#6b6155');
    } else {
      const v = noiseAt(i >> 1, j >> 1, 12);
      px1(bx, x, y, FT, FT, v < 0.33 ? '#3d5c2d' : v < 0.66 ? '#41622f' : '#456633');
      for (let k = 0; k < 16; k++) { const n = noiseAt(i, j, k + 50); px1(bx, x + (noiseAt(i + k, j, 13) * 31 | 0), y + (noiseAt(i, j + k, 17) * 29 | 0), 1, 2 + (n * 2 | 0), n < 0.5 ? '#304a24' : '#5a7d44'); }
      if (noiseAt(i, j, 99) < 0.06) { const fx = x + 6 + (noiseAt(i, j, 4) * 20 | 0), fy = y + 6 + (noiseAt(j, i, 4) * 20 | 0); px1(bx, fx, fy, 2, 2, noiseAt(i, j, 98) < 0.5 ? '#e8d65a' : '#e8e8f0'); px1(bx, fx + 4, fy + 3, 2, 2, '#d0a0d8'); }
    }
  }
  // landing pads
  [m.fieldStart, m.exit].forEach((z, n) => {
    const cx = z.tx * FT + FT / 2, cy = z.ty * FT + FT / 2;
    bx.fillStyle = '#4c4e50'; bx.beginPath(); bx.arc(cx, cy, 46, 0, 6.2832); bx.fill();
    bx.strokeStyle = n ? '#e0b83a' : '#c9c9c9'; bx.lineWidth = 4; bx.beginPath(); bx.arc(cx, cy, 40, 0, 6.2832); bx.stroke();
    bx.fillStyle = n ? '#f0d060' : '#e8e8e8'; bx.fillRect(cx - 14, cy - 18, 6, 36); bx.fillRect(cx + 8, cy - 18, 6, 36); bx.fillRect(cx - 8, cy - 3, 16, 6);
  });
  // building walls (reuse the base wall tiles with the ruin palette)
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) if (bldAt(i, j)) {
    wallTileF(bx, i * FT, j * FT, FIELD_THEME, !wallAt(i, j + 1), i, j);
    if (noiseAt(i, j, 31) < 0.25) px1(bx, i * FT + 4 + (noiseAt(i, j, 3) * 20 | 0), j * FT + 2, 6, 3, '#3a362f');
  }
  // rocks and trees (top to bottom so lower canopies overlap upper ones)
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    if (!wallAt(i, j) || bldAt(i, j) || i < 0) continue;
    const x = i * FT + FT / 2, y = j * FT + FT / 2, n = noiseAt(i, j, 5);
    if (deco[j * W + i] === W_ROCK) {
      bx.fillStyle = 'rgba(0,0,0,0.3)'; bx.beginPath(); bx.ellipse(x + 4, y + 7, 14, 9, 0, 0, 6.2832); bx.fill();
      bx.fillStyle = '#5c5f63'; bx.beginPath(); bx.ellipse(x, y + 1, 14, 12, n, 0, 6.2832); bx.fill();
      bx.fillStyle = '#7a7e83'; bx.beginPath(); bx.ellipse(x - 3, y - 2, 10, 8, n, 0, 6.2832); bx.fill();
      bx.fillStyle = '#9a9ea3'; bx.beginPath(); bx.ellipse(x - 5, y - 5, 4, 3, 0, 0, 6.2832); bx.fill();
      continue;
    }
    const R = 16 + n * 4, ox = (noiseAt(i, j, 6) - 0.5) * 5, oy = (noiseAt(i, j, 7) - 0.5) * 5;
    bx.fillStyle = 'rgba(0,0,0,0.32)'; bx.beginPath(); bx.ellipse(x + ox + 5, y + oy + 7, R, R * 0.8, 0, 0, 6.2832); bx.fill();
    bx.fillStyle = '#1f3a1b'; bx.beginPath(); bx.arc(x + ox, y + oy, R, 0, 6.2832); bx.fill();
    bx.fillStyle = n < 0.5 ? '#2c5126' : '#335a29'; bx.beginPath(); bx.arc(x + ox - 2, y + oy - 2, R * 0.78, 0, 6.2832); bx.fill();
    bx.fillStyle = n < 0.5 ? '#3d6a32' : '#466f35'; bx.beginPath(); bx.arc(x + ox - 5, y + oy - 5, R * 0.45, 0, 6.2832); bx.fill();
    for (let k = 0; k < 6; k++) px1(bx, x + ox - R * 0.6 + noiseAt(i, j, k + 60) * R * 1.2, y + oy - R * 0.6 + noiseAt(j, i, k + 60) * R * 1.2, 2, 2, k % 2 ? '#5a8a44' : '#18301a');
  }
}

// ---------------- helicopter ----------------
const HELI_FLY_IN = 2.4, HELI_LAND = 1.0;
function fieldInit(m, g) {
  m.field = true; m.deco = g.deco;
  m.fieldStart = { tx: g.start.cx, ty: g.start.cy };
  const lz = { x: g.start.cx * T + 8, y: g.start.cy * T + 8 };
  const h = { phase: 'in', t: 0, rot: 0, h: 1, lz, fx: lz.x - 320, fy: lz.y - 140, x: 0, y: 0, eta: 0, waves: 0, smokeT: 0 };
  h.x = h.fx; h.y = h.fy; h.ang = Math.atan2(lz.y - h.fy, lz.x - h.fx);
  m.heli = h;
  m.player.riding = true; m.player.x = h.x; m.player.y = h.y;
}
function heliShown(h) { return h.phase !== 'gone' && !(h.phase === 'inbound' && h.eta > 3); }
function fieldSpawnWave(m, n) {
  const ex = m.exit.tx, ey = m.exit.ty, pool = ['grunt', 'grunt', 'runner'];
  if (m.L >= 2) pool.push('bomber'); if (m.L >= 3) pool.push('gunner', 'gunner', 'drone'); if (m.L >= 5) pool.push('brute');
  let made = 0;
  for (let a = 0; a < 400 && made < n; a++) {
    const ang = Math.random() * 6.283, d = 13 + Math.random() * 9, i = Math.round(ex + Math.cos(ang) * d), j = Math.round(ey + Math.sin(ang) * d);
    if (i < 2 || j < 2 || i >= m.W - 2 || j >= m.H - 2 || m.tiles[j * m.W + i] !== TILE_FLOOR || m.vis[j * m.W + i] || m.flow[j * m.W + i] < 0) continue;
    spawnEnemy(m, pool[Math.random() * pool.length | 0], i * T + 8, j * T + 8, true); made++;
  }
}
// returns true while the player rides the helicopter (no control)
function fieldUpdate(m, dt) {
  const h = m.heli, p = m.player;
  const ease = k => k <= 0 ? 0 : k >= 1 ? 1 : 1 - (1 - k) ** 3, lerp = (a, b, k) => a + (b - a) * k;
  const go = ph => { h.phase = ph; h.t = 0; };
  const ex = { x: m.exit.tx * T + 8, y: m.exit.ty * T + 8 };
  h.t += dt; h.rot += dt * 38;
  switch (h.phase) {
    case 'in': { const k = ease(h.t / HELI_FLY_IN); h.x = lerp(h.fx, h.lz.x, k); h.y = lerp(h.fy, h.lz.y, k); h.h = 1; if (h.t >= HELI_FLY_IN) go('down'); break; }
    case 'down': h.h = lerp(1, 0.12, ease(h.t / HELI_LAND)); if (h.t >= HELI_LAND) go('drop'); break;
    case 'drop':
      if (p.riding && h.t >= 0.3) {
        p.riding = false; p.x = h.x + Math.cos(h.ang + Math.PI / 2) * 16; p.y = h.y + Math.sin(h.ang + Math.PI / 2) * 16; unstick(m, p);
        SFX.play('reload'); UI.toast('강하 완료! 목표를 달성한 뒤 노란 착륙 지점(H)으로 가면 헬기가 데리러 옵니다', 3500);
        m.flow = bfs(m.tiles, m.W, m.H, p.x >> 4, p.y >> 4, t => t === TILE_FLOOR);
      }
      if (h.t >= 0.9) { go('up'); h.fx = h.x; h.fy = h.y; }
      break;
    case 'up': {
      h.h = lerp(0.12, 1, ease(h.t / 1.2));
      const k = Math.max(0, h.t - 0.4) ** 2 * 70; h.x = h.fx + Math.cos(h.ang) * k; h.y = h.fy + Math.sin(h.ang) * k;
      if (h.t > 3.5) go('gone');
      break;
    }
    case 'gone':
      if (m.exit.active && m.state === 'play' && Math.hypot(p.x - ex.x, p.y - ex.y) < 44) {
        go('inbound'); h.eta = HELI_ETA; h.fx = ex.x + 260; h.fy = ex.y - 230; h.ang = Math.atan2(ex.y - h.fy, ex.x - h.fx); h.x = h.fx; h.y = h.fy; h.h = 1;
        SFX.play('alert'); UI.toast(`헬기 호출! ${HELI_ETA}초 후 도착 — 착륙 지점을 사수하세요`, 3500);
        fieldSpawnWave(m, 3 + (m.L >> 1)); h.waves = 1;
      }
      break;
    case 'inbound':
      h.eta -= dt;
      if (h.waves === 1 && h.eta < HELI_ETA / 2) { h.waves = 2; fieldSpawnWave(m, 3 + (m.L >> 1)); UI.toast('적 증원 접근!'); SFX.play('alert', 500); }
      if (h.eta <= 3) { const k = ease((3 - h.eta) / 3); h.x = lerp(h.fx, ex.x, k); h.y = lerp(h.fy, ex.y, k); }
      if (h.eta <= 0) { h.x = ex.x; h.y = ex.y; go('land'); }
      break;
    case 'land': h.h = lerp(1, 0.12, ease(h.t / HELI_LAND)); if (h.t >= HELI_LAND) { go('wait'); UI.toast('헬기 착륙! 탑승하세요'); } break;
    case 'wait': if (m.state === 'play' && Math.hypot(p.x - h.x, p.y - h.y) < 28) { go('board'); p.riding = true; h.bx = p.x; h.by = p.y; SFX.play('pickup'); } break;
    case 'board': if (h.t >= 0.45) { go('lift'); h.fx = h.x; h.fy = h.y; } break;
    case 'lift': {
      h.h = lerp(0.12, 1, ease(h.t / 1.2));
      const k = Math.max(0, h.t - 0.6) ** 2 * 70; h.x = h.fx + Math.cos(h.ang) * k; h.y = h.fy + Math.sin(h.ang) * k;
      if (h.t >= 1.5 && m.state === 'play') { m.state = 'win'; m.endT = 1.2; SFX.play('exit'); }
      break;
    }
  }
  if (p.riding) {
    if (h.phase === 'board') { const k = ease(h.t / 0.45); p.x = lerp(h.bx, h.x, k); p.y = lerp(h.by, h.y, k); }
    else { p.x = h.x; p.y = h.y; }
  }
  // rotor wash dust, signal smoke, rotor sound
  if (heliShown(h)) {
    if (h.h < 0.7) for (let k = 0; k < 2; k++) {
      const a = Math.random() * 6.283, d = 18 + Math.random() * 10, v = 50 + Math.random() * 40;
      m.parts.push({ x: h.x + Math.cos(a) * d, y: h.y + Math.sin(a) * d, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0.6, T: 0.6, s: 2 + Math.random() * 3, col: Math.random() < 0.5 ? '#9c8a68' : '#7d8a5a', drag: 0.93, alpha: 1 });
    }
    if (Math.hypot(h.x - p.x, h.y - p.y) < 320) SFX.play('rotor', 115);
  }

    if (h.smokeT <= 0) { h.smokeT = 0.07; m.parts.push({ x: ex.x + 18 + Math.random() * 2, y: ex.y + 14, vx: 6 + Math.random() * 8, vy: -14 - Math.random() * 10, t: 2.2, T: 2.2, s: 3 + Math.random() * 3, g: 3, col: h.phase === 'gone' ? '#e0c040' : '#5fd07a', drag: 0.99, alpha: 1 }); }
  }
  return !!p.riding;
}
// HUD text for the objective line
function fieldHud(m) {
  const h = m.heli;

  if (h.phase === 'inbound') return ` &nbsp; <span class="exit">헬기 도착 ${Math.ceil(h.eta)}초</span>`;
  if (h.phase === 'land' || h.phase === 'wait') return ' &nbsp; <span class="exit">▶ 헬기 탑승!</span>';

}

// ===================================================================
// dog.js - war dog companion: follows the player on missions, bites and pins awake enemies,
//          sniffs out sleeping enemies (marked through the fog), gains levels; also walks in the armory
// save: S.dog = { name, lvl, xp, fur, collar }
// ===================================================================
const DOG = {
  speed: 96, dmg: 8, lvlDmg: 0.12, missionMul: 0.15, biteCd: 1.0, hold: 0.6, range: 120, leash: 170, sense: 110, follow: 20,
  xpKill: 6, xpWin: 25, maxLvl: 10,
};
const DOG_FURS = {
  brown: { name: '갈색', lvl: 1, base: '#8a5a32', dark: '#5e3a1e', light: '#c89a6a' },
  black: { name: '검정', lvl: 1, base: '#2e2e33', dark: '#16161a', light: '#6a6a72' },
  grey:  { name: '회색', lvl: 1, base: '#7a7f88', dark: '#50545c', light: '#b4b8c0' },
  white: { name: '흰색', lvl: 3, base: '#e6e1d8', dark: '#b4ad9f', light: '#ffffff' },
  gold:  { name: '황금', lvl: 6, base: '#d8a23a', dark: '#a8741e', light: '#f4d48c' },
  steel: { name: '강철', lvl: 1, camp: 'r2', base: '#5a6270', dark: '#3a404a', light: '#9aa4b4' },          // campaign: region 2 clear
  obsidian: { name: '흑요석', lvl: 1, camp: 'r5', base: '#1c1424', dark: '#0a060e', light: '#8a5ac0' },  // campaign: final region clear
};
const DOG_COLLARS = ['#c0392b', '#2e86de', '#27ae60', '#f1c40f', '#8e44ad', '#ecf0f1', '#1b1b1f'];
function dogXpNeed(l) { return 50 + l * 40; }
function dogSave() { S.dog = S.dog || { name: '렉스', lvl: 1, xp: 0, fur: 'brown', collar: DOG_COLLARS[0] }; return S.dog; }
function dogBite(lvl, L) { return DOG.dmg * (1 + DOG.lvlDmg * (lvl - 1)) * (1 + DOG.missionMul * ((L || 1) - 1)); }
function dogAddXp(n) {
  const d = dogSave(); let ups = 0;
  d.xp += n;
  while (d.lvl < DOG.maxLvl && d.xp >= dogXpNeed(d.lvl)) { d.xp -= dogXpNeed(d.lvl); d.lvl++; ups++; }
  if (d.lvl >= DOG.maxLvl) d.xp = Math.min(d.xp, dogXpNeed(d.lvl));
  return ups;
}

// ---------------- drawing (world units, top-down, facing ang) ----------------
function drawDog(ctx, x, y, ang, look, t, moving, scale) {
  const f = DOG_FURS[look.fur] || DOG_FURS.brown, s = scale || 1, step = moving ? Math.sin(t * 18) : 0;
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x + 1, y + 3.5 * s, 7 * s, 2.6 * s, 0, 0, 6.2832); ctx.fill();
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  // legs
  ctx.fillStyle = f.dark;
  ctx.fillRect(2.4 + step, -3.4, 1.6, 1.4); ctx.fillRect(2.4 - step, 2.0, 1.6, 1.4);
  ctx.fillRect(-3.8 - step, -3.4, 1.6, 1.4); ctx.fillRect(-3.8 + step, 2.0, 1.6, 1.4);
  // tail (wags)
  const wag = Math.sin(t * (moving ? 10 : 14)) * 2.2;
  ctx.strokeStyle = f.dark; ctx.lineWidth = 1.3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-5, 0); ctx.quadraticCurveTo(-7, wag * 0.5, -8.6, wag); ctx.stroke(); ctx.lineCap = 'butt';
  // body + saddle
  ctx.fillStyle = f.base; ctx.beginPath(); ctx.ellipse(0, 0, 5.6, 2.9, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = f.dark; ctx.beginPath(); ctx.ellipse(-0.8, 0, 3.6, 1.6, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = f.light; ctx.fillRect(-3, -0.4, 4, 0.6);
  // collar
  ctx.fillStyle = look.collar || '#c0392b'; ctx.fillRect(3.4, -2.3, 1.3, 4.6);
  ctx.fillStyle = '#ffd34a'; ctx.fillRect(4.0, 1.9, 0.8, 0.8);
  // head, ears, snout
  ctx.fillStyle = f.dark; ctx.beginPath(); ctx.moveTo(4.4, -1.6); ctx.lineTo(5.0, -3.6); ctx.lineTo(6.2, -1.8); ctx.fill(); ctx.beginPath(); ctx.moveTo(4.4, 1.6); ctx.lineTo(5.0, 3.6); ctx.lineTo(6.2, 1.8); ctx.fill();
  ctx.fillStyle = f.base; ctx.beginPath(); ctx.arc(5.9, 0, 2.5, 0, 6.2832); ctx.fill();
  ctx.fillStyle = f.light; ctx.beginPath(); ctx.ellipse(8.0, 0, 1.7, 1.25, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#111'; ctx.fillRect(9.2, -0.5, 1, 1); ctx.fillRect(6.4, -1.3, 0.7, 0.7); ctx.fillRect(6.4, 0.6, 0.7, 0.7);
  ctx.restore();
}

// ---------------- mission ----------------
function dogInit(m) {
  const p = m.player, d = dogSave();
  m.dog = { x: p.x - 10, y: p.y + 6, r: 4, ang: 0, t: 0, moving: false, target: null, retT: 0, biteT: 0, xp: 0, kills: 0, hidden: !!p.riding, sensed: [],
    bite: dogBite(d.lvl, m.L), speed: DOG.speed * (1 + 0.03 * (d.lvl - 1)) };
  unstick(m, m.dog);
}
// a spot next to the player that is reachable (never inside the closed vault)
function dogPlace(m, g) {
  const p = m.player;
  for (const [ox, oy] of [[-10, 8], [10, 8], [-10, -8], [10, -8], [0, 12], [0, -12], [-14, 0], [14, 0]]) {
    const x = p.x + ox, y = p.y + oy, k = (y >> 4) * m.W + (x >> 4);
    if (!solidPx(m, x, y) && m.flow && m.flow[k] >= 0) { g.x = x; g.y = y; return; }
  }
  g.x = p.x; g.y = p.y;
}
// straight run without crates / barrels / walls in the way
function dogPathClear(m, x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, n = Math.ceil(Math.hypot(dx, dy) / 4);
  for (let i = 1; i < n; i++) if (solidPx(m, x0 + dx * i / n, y0 + dy * i / n)) return false;
  return true;
}
function dogUpdate(m, dt) {
  const g = m.dog, p = m.player; if (!g) return;
  g.t += dt;
  if (p.riding || m.state !== 'play') { if (p.riding) { g.hidden = true; g.x = p.x; g.y = p.y; } g.moving = false; return; }
  if (g.hidden) { g.hidden = false; dogPlace(m, g); }
  g.biteT -= dt; g.retT -= dt; g.skipT = (g.skipT || 0) - dt;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  // choose a target: awake, walking enemy near the dog and not too far from the player
  if (g.target && (!m.enemies.includes(g.target) || g.target.state === 'sleep' || dist(g.target, p) > DOG.leash)) g.target = null;
  if (g.retT <= 0) {
    g.retT = 0.4;
    let best = null, bd = 1e9;
    m.enemies.forEach(e => {
      if (e.state === 'sleep' || e.d.fly || dist(e, p) > DOG.leash || (e === g.skip && g.skipT > 0)) return;
      const d = dist(e, g); if (d > DOG.range || !dogPathClear(m, g.x, g.y, e.x, e.y)) return;
      const sc = d + dist(e, p) * 0.5; if (sc < bd) { bd = sc; best = e; }
    });
    if (best && best !== g.target) { g.target = best; SFX.play('bark', 1500); }
  }
  let tx = 0, ty = 0;
  if (g.target) {
    const e = g.target, d = dist(e, g);
    g.ang = Math.atan2(e.y - g.y, e.x - g.x);
    if (d > e.r + g.r + 2 && !dogPathClear(m, g.x, g.y, e.x, e.y)) { g.skip = e; g.skipT = 3; g.target = null; }   // something in the way: give up on it for a while
    else if (d > e.r + g.r + 2) { tx = (e.x - g.x) / d; ty = (e.y - g.y) / d; }
    else if (g.biteT <= 0) {
      g.biteT = DOG.biteCd;
      if (!e.d.heavy && !e.d.unique && !e.d.scale) e.holdT = Math.max(e.holdT || 0, DOG.hold);
      damageEnemy(m, e, g.bite, g.ang, false);
      if (!m.enemies.includes(e)) { g.kills++; g.xp += DOG.xpKill; g.target = null; }
      puff(m, e.x, e.y, 4, ['#8a2020', '#ffffff'], 30, 0.2);
    }
  } else {
    const d = dist(g, p);
    if (d > DOG.follow) {
      if (losClear(m, g.x, g.y, p.x, p.y)) { tx = (p.x - g.x) / d; ty = (p.y - g.y) / d; } else [tx, ty] = flowDir(m, g);
      if (d < DOG.follow + 12) { tx *= 0.5; ty *= 0.5; }
    }
  }
  g.moving = !!(tx || ty);
  if (g.moving) {
    const ox = g.x, oy = g.y, sp = g.speed * dt;
    moveCircle(m, g, tx * sp, ty * sp);
    if (!g.target) g.ang = Math.atan2(ty, tx);
    if (Math.abs(g.x - ox) + Math.abs(g.y - oy) < sp * 0.1) g.stuck = (g.stuck || 0) + dt; else g.stuck = 0;
  }
  if (!g.moving && !g.target && dist(g, p) > DOG.follow + 40) g.stuck = (g.stuck || 0) + dt;   // can't find a way (e.g. shut in)
  // lost or stuck for a while: catch up next to the player
  if (dist(g, p) > 260 || g.stuck > 1.5) { dogPlace(m, g); g.stuck = 0; g.target = null; }
  // sniff sleeping enemies nearby
  g.sensed = m.enemies.filter(e => e.state === 'sleep' && dist(e, g) < DOG.sense);
  g.sensed.forEach(e => { if (!e.sniffed) { e.sniffed = true; SFX.play('bark', 1500); } });
}
function renderMissionDog(ctx, m, t) {
  const g = m.dog; if (!g || g.hidden || m.state === 'dead') return;
  drawDog(ctx, g.x, g.y, g.ang, dogSave(), t, g.moving);
}
// sleeping enemies the dog smells: marked even under the fog (drawn after it)
function renderDogSense(ctx, m, t) {
  const g = m.dog; if (!g || g.hidden) return;
  g.sensed.forEach(e => {
    if (!m.enemies.includes(e)) return;
    const y = e.y - e.r - 9 + Math.sin(t * 4) * 0.8, pulse = 0.5 + 0.5 * Math.sin(t * 6);
    ctx.strokeStyle = `rgba(255,170,60,${0.35 + 0.35 * pulse})`; ctx.lineWidth = 0.75; ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4 + pulse * 2, 0, 6.2832); ctx.stroke();
    // paw print
    ctx.fillStyle = 'rgba(255,190,90,0.95)';
    ctx.beginPath(); ctx.ellipse(e.x, y + 1, 1.8, 1.4, 0, 0, 6.2832); ctx.fill();
    for (const [a, b] of [[-1.9, -1.2], [-0.7, -2.1], [0.7, -2.1], [1.9, -1.2]]) { ctx.beginPath(); ctx.arc(e.x + a, y + b, 0.65, 0, 6.2832); ctx.fill(); }
  });
}
// end of mission: dog experience (kills + success bonus)
function dogFinish(m, win) {
  const g = m.dog; if (!g) return null;
  const xp = g.xp + (win ? DOG.xpWin : 0), ups = dogAddXp(xp), d = dogSave();
  return { name: d.name, xp, ups, lvl: d.lvl, kills: g.kills };
}

// ---------------- armory: the dog trots after the hero ----------------
function updateRoomDog(dt, h) {
  const d = RE.dog || (RE.dog = { x: h.x - 14, y: h.y + 6, ang: 0, moving: false, t: 0 });
  d.t += dt;
  const bx = h.x - Math.cos(h.ang) * 14, by = h.y - Math.sin(h.ang) * 10 + 4, dx = bx - d.x, dy = by - d.y, l = Math.hypot(dx, dy);
  d.moving = l > 3;
  if (d.moving) { const sp = Math.min(l, 64 * dt); d.x += dx / l * sp; d.y += dy / l * sp; d.ang = Math.atan2(dy, dx); }
  else { const da = ((Math.atan2(h.y - d.y, h.x - d.x) - d.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI; d.ang += da * Math.min(1, dt * 3); }
  return d;
}
// preview image for the dog panel
function dogURL(look) {
  const c = mkCanvas(96, 64), x = c.getContext('2d');
  x.scale(4, 4); drawDog(x, 11, 7.5, 0, look || dogSave(), performance.now() / 1000, false);
  return c.toDataURL();
}

// ===================================================================
// interact.js - map interaction: explosive barrels, locked vault (key card + doors), alarm (reinforcements until switched off),
//               night missions (flashlight cone + flares), weather on ground missions (rain / fog)
// tiles TILE_BARREL / TILE_DOOR / TILE_ALARM are defined in mission.js; numbers live in INTERACT (data.js)
// ===================================================================

// ---------------- setup (called from startMission after the crates) ----------------
function setupInteract(m, g, r, others, freeTile) {
  const { W, H, tiles } = m, L = m.L, I = INTERACT;
  // explosive barrels
  others.forEach(o => {
    if (r() > I.barrelRoom) return;
    const n = 1 + (r() < 0.4 ? 1 : 0) + (m.field && r() < 0.5 ? 1 : 0);
    for (let k = 0; k < n; k++) { const p = freeTile(o, 1); if (p) { tiles[p.y * W + p.x] = TILE_BARREL; m.crateHp[p.y * W + p.x] = I.barrelHp; } }
  });
  if (m.field) return;
  // locked vault: one side room behind yellow doors; the key card lies in another room
  if ((L >= I.vaultLvl && others.length >= 4 && r() < I.vaultChance) || (m.def.vault && others.length >= 4)) {
    const cands = others.filter(o => o !== g.exitRoom).sort(() => r() - 0.5);
    for (const o of cands) {
      const doors = [];
      for (let j = o.y - 1; j <= o.y + o.h; j++) for (let i = o.x - 1; i <= o.x + o.w; i++) {
        const edge = i === o.x - 1 || j === o.y - 1 || i === o.x + o.w || j === o.y + o.h;
        if (edge && i > 0 && j > 0 && i < W - 1 && j < H - 1 && tiles[j * W + i] === TILE_FLOOR) doors.push(j * W + i);
      }
      if (!doors.length || doors.length > (m.def.vault ? 10 : 6)) continue;
      doors.forEach(k => { tiles[k] = TILE_DOOR; });
      const dist = bfs(tiles, W, H, g.start.cx, g.start.cy, t => t !== TILE_WALL && t !== TILE_DOOR);
      const ok = dist[g.exitRoom.cy * W + g.exitRoom.cx] >= 0 && others.every(q => q === o || dist[q.cy * W + q.cx] >= 0);
      if (!ok) { doors.forEach(k => { tiles[k] = TILE_FLOOR; }); continue; }
      others.splice(others.indexOf(o), 1);
      m.vault = { room: o, doors, open: false };
      // loot inside

function updateInteract(m, dt) {

  const due = m.booms.filter(b => b.t <= 0);

  due.forEach(b => {
    const dmg = I.barrelDmg * (1 + 0.15 * (m.L - 1));
    explode(m, b.x, b.y, I.barrelRad, dmg);
    const d = Math.hypot(p.x - b.x, p.y - b.y);
    if (d < I.barrelRad + p.r) hurtPlayer(m, I.barrelHurt * (1 + 0.12 * (m.L - 1)) * (1 - d / (I.barrelRad + p.r) * 0.5), b.x, b.y);
    if (m.dog && !m.dog.hidden) { const a = Math.atan2(m.dog.y - b.y, m.dog.x - b.x); if (Math.hypot(m.dog.x - b.x, m.dog.y - b.y) < I.barrelRad) moveCircle(m, m.dog, Math.cos(a) * 6, Math.sin(a) * 6); }
  });
  // flares burn out
  m.flares = m.flares.filter(f => {
    f.t -= dt;
    if (Math.random() < 0.5) m.parts.push({ x: f.x + (Math.random() - 0.5) * 2, y: f.y - 2, vx: (Math.random() - 0.5) * 30, vy: -20 - Math.random() * 30, t: 0.5, T: 0.5, s: 1.2, col: Math.random() < 0.5 ? '#ffd0a0' : '#ff6a3a', drag: 0.95 });

    if (m.hasKey) {

  }

    if (Math.hypot(p.x - ax, p.y - ay) < 22) { alarmOff(m, '해제'); return; }

// mods.js - weapon mod parts: items in S.mods ({ id, mod, rarity, w }) where w = weapon key it is fitted to (or null).
//           one part per slot (mag / muzzle / ammo) per weapon. Missions only (battles use plain weapon stats).
//           numbers: MODS, MOD_* in data.js
// ===================================================================
function makeMod(rarity, mod) {
  const ids = Object.keys(MODS);
  return { id: newId('m'), mod: mod || ids[Math.random() * ids.length | 0], rarity: rarity | 0, w: null };
}
function modVal(it) { return MODS[it.mod].base * RARITY[it.rarity].mul; }
function modValue(it) { return Math.round(MOD_SELL * RARITY[it.rarity].mul / 5) * 5; }

function modsOn(key) { return (S.mods || []).filter(it => it.w === key); }
function modText(it) {
  const v = modVal(it), p = x => Math.round(x * 100) + '%';
  switch (it.mod) {
    case 'extmag': return `탄창 +${p(v)}`;
    case 'quickmag': return `재장전 시간 -${p(Math.min(0.5, v))}`;
    case 'silencer': return `잠든 적에게 피해 +${p(v)} · 맞힌 적 주변이 깨지 않음`;
    case 'comp': return `탄 퍼짐 -${p(Math.min(0.8, v))}`;
    case 'hollow': return `피해 +${p(v)}`;
    case 'pierce': return `적을 관통 · 피해 -${p(MOD_PIERCE_COST / RARITY[it.rarity].mul)}`;
    case 'incend': return `맞힌 적 3초 화상 (초당 그 피해의 ${p(v)})`;
  }
  return '';
}
// weapon stats with the fitted parts applied
function applyMods(st, key) {
  st = Object.assign({}, st);
  modsOn(key).forEach(it => {
    if (!modFits(it, key)) return;
    const v = modVal(it);
    switch (it.mod) {
      case 'extmag': st.mag = Math.ceil(st.mag * (1 + v)); break;
      case 'quickmag': st.reload *= 1 - Math.min(0.5, v); break;
      case 'silencer': st.silent = v; break;
      case 'comp': st.spread *= 1 - Math.min(0.8, v); break;
      case 'hollow': st.dmg *= 1 + v; break;
      case 'pierce': st.pierce = true; st.dmg *= 1 - MOD_PIERCE_COST / RARITY[it.rarity].mul; break;
      case 'incend': st.burn = v; break;
    }
  });
  return st;
}
// add parts to the stash; the overflow is sold. returns { kept, soldCr }
function stashMods(list) {
  S.mods = S.mods || [];
  const room = Math.max(0, MOD_MAX - S.mods.length), kept = list.slice(0, room), sold = list.slice(kept.length);
  kept.forEach(it => S.mods.push(it));
  const soldCr = sold.reduce((a, it) => a + modValue(it), 0); S.credits += soldCr;
  return { kept, soldCr };
}

  { stars: 15, text: '◈1,000', give: () => { S.credits += 1000; } },

const CAMP_REWARD_MUL = 1.2;       // operation rewards vs free missions
const CAMP_SPEAKERS = { '관제': '#7fd0ff', '정보관': '#9fe3a0', '백 박사': '#e070ff', '감시자': '#ff8a6a' };

// ---------------- progress ----------------
function campSave() { S.camp = S.camp || { done: {}, cleared: {}, claimed: [] }; S.camp.done = S.camp.done || {}; S.camp.cleared = S.camp.cleared || {}; S.camp.claimed = S.camp.claimed || []; return S.camp; }
function campNode(id) { for (const R of CAMPAIGN) for (const n of R.nodes) if (n.id === id) return n; return null; }
function campRegionOpen(ri) { return ri === 0 || !!campSave().cleared[CAMPAIGN[ri - 1].id]; }
function campNodeOpen(n) { return campRegionOpen(CAMPAIGN.indexOf(n.region)) && (n.index === 0 || (campSave().done[n.region.nodes[n.index - 1].id] | 0) > 0); }
function campStars(n) { return campSave().done[n.id] | 0; }
function campTotalStars() { return Object.values(campSave().done).reduce((a, b) => a + (b | 0), 0); }
function campCleared(rid) { return !!campSave().cleared[rid]; }
function campStrHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; }
function starText(s) {
  switch (s[0]) {
    case 'hp': return `체력 ${s[1]}% 이상 남기고 성공`;
    case 'time': return `${Math.floor(s[1] / 60)}분${s[1] % 60 ? ' ' + (s[1] % 60) + '초' : ''} 안에 성공`;
    case 'noAlarm': return '경보를 한 번도 울리지 않고 성공';
    case 'noSupply': return '소모품을 쓰지 않고 성공';
  }
  return '';
}
// mission definition for an operation (fixed seed -> the same map every time)
function campDef(n) {
  const R = n.region, lvl = n.lvl;
  const def = {
    seed: campStrHash('irondogs:' + n.id), level: lvl, theme: n.theme ?? R.theme ?? 0, name: n.name,
    goals: n.goals.map(([type, need]) => ({ type, need, got: 0 })),
    rewardCr: Math.round((250 + lvl * 160) * CAMP_REWARD_MUL), rewardXp: Math.round((70 + lvl * 45) * CAMP_REWARD_MUL),
    camp: n.id,
  };
  if (n.field ?? R.field) def.kind = 'field';
  if (n.night ?? R.night) def.night = true;
  if (n.weather) def.weather = n.weather;
  if (n.alarm ?? R.alarm) def.alarm = true;
  if (n.vault) def.vault = true;
  if (n.boss) def.boss = n.boss;
  return def;
}
function campGiveGear(level, rarity) {   // returns credits gained when the storage was full (item sold)
  const it = makeGear(level, rarity);
  if (S.inv.length < INV_MAX) { S.inv.push(it); return 0; }
  const v = gearValue(it); S.credits += v; return v;
}
// end of an operation: stars, progress, region reward. returns info for the result panel
function campFinish(m, win) {
  const n = campNode(m.def.camp); if (!n) return null;
  const p = m.player;
  const conds = n.stars.map(s => ({ text: starText(s), ok: win && (
    s[0] === 'hp' ? p.hp / p.ps.maxHp * 100 >= s[1] :
    s[0] === 'time' ? (m.clearTime ?? m.time) <= s[1] :
    s[0] === 'noAlarm' ? !(m.alarm && m.alarm.on) :
    s[0] === 'noSupply' ? !m.usedSupply : false) }));
  const res = { id: n.id, name: n.name, region: n.region.name, win, conds, stars: 0, best: campStars(n) };
  if (!win) return res;
  const c = campSave();
  res.stars = 1 + conds.filter(x => x.ok).length;
  res.first = !c.done[n.id];
  c.done[n.id] = Math.max(c.done[n.id] | 0, res.stars);
  res.best = c.done[n.id];
  const R = n.region;
  if (n.boss && !c.cleared[R.id]) {
    c.cleared[R.id] = true;
    const rw = R.reward;
    if (rw.cr) S.credits += rw.cr;
    let sold = 0;
    if (rw.mod) sold += stashMods([makeMod(rw.mod)]).soldCr;
    if (rw.gear) sold += campGiveGear(n.lvl + 1, rw.gear);
    res.regionClear = { sold, name: R.name, reward: rw.text, outro: R.outro, final: R === CAMPAIGN[CAMPAIGN.length - 1], next: CAMPAIGN[CAMPAIGN.indexOf(R) + 1] };
  }
  return res;
}
function campClaim(i) {
  const c = campSave(), ms = CAMP_MILESTONES[i];
  if (!ms || c.claimed.includes(i) || campTotalStars() < ms.stars) return false;
  if ((ms.mods && (S.mods || []).length + ms.mods > MOD_MAX) || (ms.gear && S.inv.length + ms.gear > INV_MAX)) return 'full';   // make room first
  c.claimed.push(i); ms.give(); return true;
}

// ---------------- bosses ----------------
function spawnBoss(m, g, others, freeTile) {
  const far = others.slice().sort((a, b) => ((b.cx - g.start.cx) ** 2 + (b.cy - g.start.cy) ** 2) - ((a.cx - g.start.cx) ** 2 + (a.cy - g.start.cy) ** 2));
  for (const room of far) {
    const p = freeTile(room, 1) || freeTile(room, 0);
    if (!p) continue;
    spawnEnemy(m, m.def.boss, p.x * T + 8, p.y * T + 8, false);
    m.boss = m.enemies[m.enemies.length - 1]; m.boss.phase = 1;

// room.js - the armory (home base): rendering, decorating, hero walk

const ROOM_OX = (VW - ROOM_W * T) / 2, ROOM_OY = 26;
const RE = { on: false, placeId: null, sel: null, moving: false, flash: null, hero: null };

function roomTileAt(px, py) { return { x: Math.floor((px - ROOM_OX) / T), y: Math.floor((py - ROOM_OY) / T) }; }
function canPlace(id, x, y, ignoreUid) {
  const f = FURNITURE[id];

  if (f.layer === 'wall') { if (y !== 0) return false; }
  else if (y < 1 || y + f.h > ROOM_H) return false;
  return !S.room.items.some(o => {
    if (o.uid === ignoreUid) return false;
    const g = FURNITURE[o.id];
    if (g.layer !== f.layer) return false;
    return x < o.x + g.w && x + f.w > o.x && y < o.y + g.h && y + f.h > o.y;

}
function findSpot(id) {
  for (let y = 0; y < ROOM_H; y++) for (let x = 0; x < ROOM_W; x++) if (canPlace(id, x, y)) return { x, y };
  return null;
}
function roomPick(px, py) {
  const { x, y } = roomTileAt(px, py);
  const hit = S.room.items.filter(o => { const g = FURNITURE[o.id]; return x >= o.x && x < o.x + g.w && y >= o.y && y < o.y + g.h; });
  const order = { obj: 2, wall: 1, floor: 0 };

    if (!d) return null;
    if (f.slots.type === 'weapon') return S.weapons[d] ? { key: d, paint: S.weapons[d].paint } : null;
    return itemById(d);

}

// ---------- actions ----------
function placeFurniture(id, x, y) {
  if (!S.furnInv[id] || !canPlace(id, x, y)) return false;
  S.furnInv[id]--; if (!S.furnInv[id]) delete S.furnInv[id];
  const f = FURNITURE[id];
  S.room.items.push({ uid: newId('f'), id, x, y, disp: f.slots ? new Array(f.slots.n).fill(null) : [] });
  saveGame(); return true;
}
function storeFurniture(uid) {
  const i = S.room.items.findIndex(o => o.uid === uid); if (i < 0) return;
  const o = S.room.items[i]; S.room.items.splice(i, 1);
  S.furnInv[o.id] = (S.furnInv[o.id] || 0) + 1; saveGame();
}
function moveFurniture(uid, x, y) {
  const o = S.room.items.find(q => q.uid === uid); if (!o || !canPlace(o.id, x, y, uid)) return false;
  o.x = x; o.y = y; saveGame(); return true;

// ---------- hero walking ----------
function heroState() {

  return RE.hero;
}
function heroWalkTo(px, py) {

function renderRoom(ctx, t) {

// ---------- pointer handling (called by UI with canvas coordinates) ----------
function roomPointer(px, py, kind) {
  const tile = roomTileAt(px, py), inRoom = tile.x >= 0 && tile.y >= 0 && tile.x < ROOM_W && tile.y < ROOM_H;
  if (RE.on) {
    if (kind === 'move') { RE.ghost = inRoom ? tile : null; return; }
    if (kind !== 'tap' || !inRoom) return;
    if (RE.placeId) {
      if (placeFurniture(RE.placeId, tile.x, tile.y)) { SFX.play('click'); if (!S.furnInv[RE.placeId]) RE.placeId = null; UI.refreshEdit(); }

      return;
    }
    if (RE.moving && RE.sel) {
      if (moveFurniture(RE.sel, tile.x, tile.y)) { RE.moving = false; SFX.play('click'); UI.refreshEdit(); }
      else { RE.flash = { x: tile.x, y: tile.y, t: 0.5 }; RE.ghost = tile; }
      return;

    const o = roomPick(px, py);

  // ---------------- weapons ----------------
  p_weapons() {
    const disc = roomBonus().upgradeDiscount;
    let h = `<h3>출격 장비 (주무기 · 보조무기)</h3><div class="slots" style="grid-template-columns:1fr 1fr">` + [0, 1].map(i => {
      const k = S.loadout[i];
      return `<div class="slot">${k ? `<img src="${this.icon('weapon', k, S.weapons[k].paint)}" style="width:72px;height:36px"><b>${WEAPONS[k].name}</b>` : '<div style="padding-top:22px;color:var(--dim)">비어 있음</div>'}<div class="s">${i ? '보조' : '주무기'}</div></div>`;
    }).join('') + '</div>';
    h += disc ? '<div class="s" style="color:var(--good);margin-bottom:6px">작업대 효과: 강화 비용 5% 할인</div>' : '';
    h += `<div class="row"><div class="grow"><div class="t">개조 부품 <span class="s">보유 ${(S.mods || []).length} / ${MOD_MAX}</span></div><div class="s">무기마다 탄창·총구·탄약 칸에 부품을 1개씩 끼웁니다. 아래 칸을 눌러 장착</div></div><button class="small" data-a="modAll">부품 관리</button></div>`;
    WEAPON_ORDER.forEach(k => {
      const w = S.weapons[k], b = WEAPONS[k];
      if (!w) {
        h += `<div class="row"><img src="${this.icon('weapon', k, '#3d3d52')}" width="64" style="opacity:.5"><div class="grow"><div class="t">${b.name}</div><div class="s">${b.desc}</div></div>
          <button class="go" data-a="wbuy" data-k="${k}" ${S.credits >= b.price ? '' : 'disabled'}>구매 ◈${fmt(b.price)}</button></div>`;
        return;
      }
      const st = applyMods(weaponStats(k, w.lvl), k), nx = w.lvl < MAX_WLVL ? applyMods(weaponStats(k, w.lvl + 1), k) : null, cost = Math.round(upgradeCost(k, w.lvl) * (1 - disc));
      const inSlot = S.loadout.indexOf(k);
      h += `<div class="row ${inSlot >= 0 ? 'selected' : ''}"><img src="${this.icon('weapon', k, w.paint)}" width="64"><div class="grow">
        <div class="t">${b.name} <span style="color:var(--acc)">+${w.lvl}</span></div>
        <div class="s">피해 ${st.dmg.toFixed(1)}${b.pellets ? '×' + b.pellets : ''}${nx ? ` <span class="up">→${nx.dmg.toFixed(1)}</span>` : ''} · 연사 ${st.rate.toFixed(1)}/초 · 탄창 ${st.mag}${nx && nx.mag > st.mag ? ` <span class="up">→${nx.mag}</span>` : ''}</div>
        <div class="modrow">${MOD_WEAPON_SLOTS[k].map(sl => { const it = modsOn(k).find(x => MODS[x.mod].slot === sl); return `<button class="small modchip" data-a="modPick" data-k="${k}" data-s="${sl}" style="${it ? 'border-color:' + RARITY[it.rarity].color : ''}">${MOD_SLOTS[sl]}: ${it ? modBadge(it) + `<b style="color:${RARITY[it.rarity].color}">${MODS[it.mod].name}</b>` : '<span class="s">＋ 비어 있음</span>'}</button>`; }).join('')}</div>
        <div style="margin-top:4px">${PAINTS.map(c => `<span class="sw ${c === w.paint ? 'on' : ''}" style="background:${c}" data-a="wpaint" data-k="${k}" data-c="${c}"></span>`).join('')}<span class="s"> 도색 ◈100</span></div></div>
        <div style="display:flex;flex-direction:column;gap:5px">
        ${nx ? `<button class="go small" data-a="wup" data-k="${k}" ${S.credits >= cost ? '' : 'disabled'}>강화 ◈${fmt(cost)}</button>` : '<span class="s">최대 강화</span>'}
        <button class="small" data-a="wslot" data-k="${k}" data-i="0">${inSlot === 0 ? '✓ 주무기' : '주무기로'}</button>
        <button class="small" data-a="wslot" data-k="${k}" data-i="1">${inSlot === 1 ? '✓ 보조' : '보조로'}</button></div></div>`;
    });
    return ['무기 · 강화', h];
  },
  // ---------------- weapon mod parts ----------------
  p_mods() {
    const k = this.sub.k, sl = this.sub.s, all = S.mods || [], rc = it => RARITY[it.rarity].color;
    const row = (it, btns) => `<div class="row" style="border-color:${rc(it)}">${modBadge(it)}<div class="grow"><div class="t" style="color:${rc(it)}">${MODS[it.mod].name} <span class="s">${RARITY[it.rarity].name} · ${MOD_SLOTS[MODS[it.mod].slot]}</span></div>
      <div class="s">${modText(it)}${it.w ? ` · <b style="color:var(--acc)">${WEAPONS[it.w].name}에 장착 중</b>` : ''}</div></div>${btns}</div>`;
    let h = `<button class="small" data-a="modBack">← 무기 화면</button> <span class="s">보유 ${all.length} / ${MOD_MAX}</span>`;
    if (k) {
      const cur = modsOn(k).find(x => MODS[x.mod].slot === sl);
      h += `<h3>${WEAPONS[k].name} — ${MOD_SLOTS[sl]} 칸</h3>`;
      if (cur) h += row(cur, `<button class="small" data-a="modOff" data-id="${cur.id}">해제</button>`);
      const fit = all.filter(it => it !== cur && MODS[it.mod].slot === sl && modFits(it, k)).sort((a, b) => b.rarity - a.rarity);
      h += `<h3>끼울 수 있는 부품 (${fit.length})</h3>`;
      h += fit.length ? fit.map(it => row(it, `<button class="go small" data-a="modOn" data-id="${it.id}" data-k="${k}">장착</button>`)).join('')
        : '<div class="s">맞는 부품이 없습니다. 임무 성공 보상·적 처치·금고·상점 [보급 상자]의 부품 상자에서 얻습니다.</div>';
    } else {
      h += '<h3>전체 부품</h3><div class="s" style="margin-bottom:6px">장착 중인 부품은 해제해야 팔 수 있습니다.</div>';
      h += all.length ? all.slice().sort((a, b) => b.rarity - a.rarity).map(it => row(it, it.w ? `<button class="small" data-a="modOff" data-id="${it.id}">해제</button>` : `<button class="small" data-a="modSell" data-id="${it.id}">판매 ◈${fmt(modValue(it))}</button>`)).join('')
        : '<div class="s">아직 부품이 없습니다.</div>';
    }
    return ['개조 부품', h];
  },
  a_modAll() { this.openPanel('mods', {}); },
  a_modPick(d) { this.openPanel('mods', { k: d.k, s: d.s }); },
  a_modBack() { this.openPanel('weapons'); },
  a_modOn(d) {
    const it = (S.mods || []).find(x => x.id === d.id); if (!it || !S.weapons[d.k] || !modFits(it, d.k)) return;
    modsOn(d.k).filter(x => MODS[x.mod].slot === MODS[it.mod].slot).forEach(x => { x.w = null; });
    it.w = d.k; saveGame(); SFX.play('reload'); this.toast(`${WEAPONS[d.k].name}에 ${MODS[it.mod].name} 장착`); this.openPanel('weapons');
  },
  a_modOff(d) { const it = (S.mods || []).find(x => x.id === d.id); if (!it) return; it.w = null; saveGame(); SFX.play('click'); this.render(); },
  a_modSell(d) {
    const i = (S.mods || []).findIndex(x => x.id === d.id); if (i < 0 || S.mods[i].w) return;
    const it = S.mods.splice(i, 1)[0]; S.credits += modValue(it); saveGame(); SFX.play('coin'); this.render();
  },
  a_mbox(d) {
    const p = MOD_BOX(S.lvl); if (S.credits < p || (S.mods || []).length >= MOD_MAX) return;
    S.credits -= p; const it = makeMod(rollRarity(S.lvl, 10)); stashMods([it]); saveGame();
    SFX.play(it.rarity >= 3 ? 'levelup' : 'buy'); this.sub.gotMod = it.id; this.sub.got = null; this.render();
  },
  a_wbuy(d) { const b = WEAPONS[d.k]; if (S.credits < b.price) return; S.credits -= b.price; S.weapons[d.k] = { lvl: 0, paint: PAINTS[0] }; if (!S.loadout[1]) S.loadout[1] = d.k; saveGame(); SFX.play('buy'); this.toast(b.name + ' 구매 완료'); this.render(); },
  a_wup(d) {
    const w = S.weapons[d.k], cost = Math.round(upgradeCost(d.k, w.lvl) * (1 - roomBonus().upgradeDiscount));
    if (S.credits < cost || w.lvl >= MAX_WLVL) return; S.credits -= cost; w.lvl++; saveGame(); SFX.play('buy'); this.render();
  },
  a_wslot(d) {
    const i = +d.i, other = 1 - i;
    if (S.loadout[i] === d.k) { if (i === 0) return; S.loadout[i] = null; }
    else { if (S.loadout[other] === d.k) S.loadout[other] = S.loadout[i]; S.loadout[i] = d.k; }
    if (!S.loadout[0]) S.loadout[0] = S.loadout[1] || 'pistol';
    if (S.loadout[1] === S.loadout[0]) S.loadout[1] = null;
    saveGame(); SFX.play('click'); this.render();
  },
  a_wpaint(d) { const w = S.weapons[d.k]; if (w.paint === d.c) return; if (S.credits < 100) { this.toast('크레딧이 부족합니다'); return; } S.credits -= 100; w.paint = d.c; saveGame(); SFX.play('click'); this.render(); },

  gearDetail(it) {
    const eqId = S.equip[it.slot], eq = itemById(eqId), equipped = eqId === it.id;
    const keys = new Set([...Object.keys(it.stats), ...(eq && !equipped ? Object.keys(eq.stats) : [])]);
    let h = `<div class="row" style="border-color:${RARITY[it.rarity].color}"><img src="${this.icon('gear', it.slot, it.color, 6)}" width="72"><div class="grow">

    h += '<h3>능력치' + (eq && !equipped ? ' (현재 장착 장비와 비교)' : '') + '</h3>';

      ${equipped ? '' : `<button data-a="gsell" data-id="${it.id}">판매 ◈${fmt(gearValue(it))}</button>`}</div>`;
    return ['장비 상세', h];
  },

  a_tab(d) { this.sub.tab = d.t; this.sub.got = null; this.render(); },
  a_fbuy(d) { const f = FURNITURE[d.id]; if (S.credits < f.price) return; S.credits -= f.price; S.furnInv[d.id] = (S.furnInv[d.id] || 0) + 1; saveGame(); SFX.play('buy'); this.toast(`${f.name} 구매 · [꾸미기]에서 배치하세요`); this.render(); },
  a_theme(d) {
    const set = d.k === 'floor' ? ROOM_FLOORS : ROOM_WALLS, t = set[d.id];

  },
  a_box(d) {
    const p = +d.p; if (S.credits < p || S.inv.length >= INV_MAX) return;
    S.credits -= p; const it = makeGear(S.lvl, rollRarity(S.lvl, d.k === 'elite' ? 30 : 0)); S.inv.push(it); saveGame();

  a_nbuy(d) {

  },

  // ---------------- missions ----------------
  // ---------------- campaign map ----------------
  lineHTML(l) { const c = CAMP_SPEAKERS[l[0]] || '#fff'; return `<div class="cline-txt" style="border-left-color:${c}"><b style="color:${c}">${l[0]}</b>${l[1]}</div>`; },
  p_camp() {
    const c = campSave(), total = campTotalStars();
    let ri = this.sub.r; if (ri === undefined) { ri = 0; for (let i = 0; i < CAMPAIGN.length; i++) if (campRegionOpen(i)) ri = i; this.sub.r = ri; }
    const R = CAMPAIGN[ri];
    let h = `<div class="row"><div class="grow"><div class="t">회색 구역 작전 <span style="color:var(--acc)">★ ${total} / ${CAMPAIGN.length * 15}</span></div><div class="s">별을 모으면 보상: ${CAMP_MILESTONES.map((ms, i) => c.claimed.includes(i) ? `<s>${ms.stars}★</s>` : `${ms.stars}★`).join(' · ')}</div></div>`;
    const ready = CAMP_MILESTONES.findIndex((ms, i) => !c.claimed.includes(i) && total >= ms.stars);
    if (ready >= 0) h += `<button class="go small" data-a="cclaim" data-i="${ready}">${CAMP_MILESTONES[ready].stars}★ 보상 받기<br><span class="s" style="color:inherit">${CAMP_MILESTONES[ready].text}</span></button>`;
    h += '</div><div class="cregions">' + CAMPAIGN.map((Q, i) => {
      const open = campRegionOpen(i), st = Q.nodes.reduce((a, n) => a + campStars(n), 0);
      return `<button class="${i === ri ? 'on' : ''}" data-a="creg" data-i="${i}" ${open ? '' : 'disabled'}>${open ? '' : '🔒 '}지역 ${i + 1}<br><b>${Q.name}</b><br><span class="s">${campCleared(Q.id) ? '✓ 확보' : open ? '★ ' + st + '/15' : '잠김'}</span></button>`;
    }).join('') + '</div>';
    h += `<div class="s">${R.desc}${R.field ? ' · <b style="color:#9fd36a">지상 작전</b>' : ''}${R.night ? ' · <b style="color:#8ab8ff">야간</b>' : ''}${R.alarm ? ' · <b style="color:#ff6a6a">경보 장치</b>' : ''}</div>`;
    // node path
    let sel = this.sub.n;
    if (sel === undefined || sel === null || CAMPAIGN[ri].nodes[sel] === undefined) { sel = R.nodes.findIndex(n => campNodeOpen(n) && !campStars(n)); if (sel < 0) sel = R.nodes.length - 1; this.sub.n = sel; }
    h += '<div class="cmap">' + R.nodes.map((n, i) => {
      const open = campNodeOpen(n), st = campStars(n), cls = ['cnode', n.boss ? 'boss' : '', st ? 'done' : open ? 'open' : 'lock', i === sel ? 'sel' : ''].join(' ');
      return (i ? `<div class="cline ${st || campStars(R.nodes[i - 1]) ? 'on' : ''}"></div>` : '') + `<button class="${cls}" data-a="cnode" data-i="${i}">${n.boss ? '◆' : i + 1}<span class="st">${open ? '★'.repeat(st) + '☆'.repeat(3 - st) : '🔒'}</span></button>`;
    }).join('') + '</div><div style="height:12px"></div>';
    // selected operation
    const n = R.nodes[sel], open = campNodeOpen(n), def = campDef(n), diff = n.lvl - S.lvl, col = diff >= 2 ? 'var(--bad)' : diff >= 0 ? 'var(--acc)' : 'var(--good)';
    const tags = [def.kind === 'field' ? '<b style="color:#9fd36a">지상 작전</b>' : MISSION_THEMES[def.theme].name, def.night ? '<b style="color:#8ab8ff">야간</b>' : '', def.weather === 'rain' ? '<b style="color:#9fc4ff">비</b>' : def.weather === 'fog' ? '<b style="color:#c8ccd2">안개</b>' : '', def.alarm ? '<b style="color:#ff6a6a">경보 장치</b>' : '', def.vault ? '<b style="color:#ffd34a">금고</b>' : ''].filter(Boolean).join(' · ');
    h += `<div class="row" style="flex-direction:column;align-items:stretch;border-color:${n.boss ? '#c0392b' : 'var(--line)'}"><div style="display:flex;align-items:center;gap:8px"><div class="grow"><div class="t">${n.boss ? '◆ 보스 — ' : `작전 ${sel + 1} — `}${n.name} <span style="color:${col}">권장 Lv ${n.lvl}</span></div>
      <div class="s">${tags} · ${def.goals.map(g => OBJ_TYPES[g.type].text(g.need)).join(' + ')}</div><div class="s">보상 ◈${fmt(def.rewardCr)} · 경험치 ${fmt(def.rewardXp)}${n.boss ? ` · 지역 보상 ${R.reward.text}` : ''}</div></div>
      ${open ? `<button class="go" data-a="cgo" data-r="${ri}" data-i="${sel}">출격</button>` : '<span class="s">🔒 앞 작전을 먼저</span>'}</div>`;
    h += (sel === 0 ? R.intro : []).concat(n.brief || []).map(l => this.lineHTML(l)).join('');
    h += `<div class="cstar ${campStars(n) >= 1 ? 'ok' : ''}">★ 임무 성공</div>` + n.stars.map(s => `<div class="cstar">★ ${starText(s)}</div>`).join('');
    h += `<div class="s">최고 기록 ${'★'.repeat(campStars(n))}${'☆'.repeat(3 - campStars(n))} · 같은 작전은 항상 같은 맵입니다</div></div>`;
    if (campCleared(R.id)) h += '<h3>작전 기록</h3>' + R.outro.map(l => this.lineHTML(l)).join('');

  },
  a_ctab(d) { this.sub.tab = d.t; this.render(); },
  a_creg(d) { if (!campRegionOpen(+d.i)) return; this.sub.r = +d.i; this.sub.n = null; SFX.play('click'); this.render(); },

  a_cclaim(d) { const ok = campClaim(+d.i); if (ok === 'full') { this.toast('보관함(장비·부품)이 가득 찼습니다. 정리한 뒤 받으세요'); return; } if (ok) { saveGame(); SFX.play('levelup'); this.toast(`별 보상 획득: ${CAMP_MILESTONES[+d.i].text}`); this.render(); } },
  // radio messages during missions: [speaker, text] lines shown one after another
  radio(lines) {
    if (!lines || !lines.length) return;

    if (!this._rt) this._radioNext();
  },
  _radioNext() {
    const l = (this._rq || []).shift(), el = $('radio');
    if (!l) { this._rt = null; el.classList.add('hidden'); return; }
    const c = CAMP_SPEAKERS[l[0]] || '#ffffff';
    $('radioWho').textContent = l[0]; $('radioWho').style.color = c; el.style.borderLeftColor = c; $('radioText').textContent = l[1];
    el.classList.remove('hidden'); el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';

  p_display() {

    for (let i = 0; i < f.slots.n; i++) {
      const v = disp[i];
      const img = !v ? '' : type === 'weapon' ? `<img src="${this.icon('weapon', v.key, v.paint)}" style="width:72px;height:36px">` : `<img src="${this.icon('gear', v.slot, v.color)}">`;
