// ===================================================================
// fps3d.js - first-person 3D view of a mission (Three.js / WebGL)
// The mission logic stays 2D (x, y on the tile grid). This file only draws it in 3D and turns input into a view direction.
// world (x, y) -> 3D (x, height, y). Yaw only (no looking up / down): hits are decided in 2D.
// No head bob, no camera shake, no recoil on the camera (the user is sensitive to motion sickness).
// Ground operations (m.field) are drawn too: trees / rocks as crossed quads, ruined buildings, open sky, the helicopter as a box model.
// Night = dark fog + a flashlight circle on the overlay, rain / fog = fog distance + overlay (f3Atmos).
// ===================================================================

  ok: null,            // WebGL available? (null = not tried yet)
  yaw: 0,              // view direction (same angle as player.ang)
  eye: 11, wallH: 22, fov: 60,
  sens: 0.0026,        // mouse: radians per pixel

function f3Init() {
  if (F3.ok !== null) return F3.ok;

  if (inp.autoFire > 0) inp.autoFire -= dt;
}
function f3Turn(dx, k) { F3.yaw += Math.max(-150, Math.min(150, dx)) * k * ((S && S.settings && S.settings.sens) || 1); }   // S.settings.sens: look sensitivity chosen in the settings

// ===================================================================
// main.js - loop, scaling, input
// ===================================================================
const cv = $('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fitCanvas() {
  const s = Math.min(innerWidth / VW, innerHeight / VH);
  cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px';
  cv.style.left = (innerWidth - VW * s) / 2 + 'px'; cv.style.top = (innerHeight - VH * s) / 2 + 'px';
}
addEventListener('resize', fitCanvas); fitCanvas();
function toCanvas(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH }; }

const Game = {
  mode: 'title', paused: false, mapHeld: false,
  startMission(def) {
    SFX.init(); startMission(def); this.mode = 'mission'; this.paused = false;
    resetInput(); UI.show('hud'); UI.toast(`${def.name} — ${def.goals.map(g => OBJ_TYPES[g.type].text(g.need)).join(', ')}`, 3500);
    if (def.camp) { const n = campNode(def.camp); if (n && n.brief) UI.radio(n.brief); }
    if (def.night) UI.toast('<b style="color:#8ab8ff">야간 작전</b> — 손전등이 비추는 곳만 보입니다. 조명탄(T)으로 넓게 밝히세요', 4000);
    else if (def.weather) UI.toast(def.weather === 'rain' ? '비 — 시야가 조금 줄어듭니다' : '짙은 안개 — 시야가 크게 줄어듭니다. 조명탄이 도움이 됩니다', 3500);
  },
  toHub() { UI.radioStop(); this.mode = 'hub'; M = null; RE.hero = null; UI.show('hub'); },
};

// ---------------- input state ----------------
const inp = { mx: 0, my: 0, aiming: false, aimAng: 0, fire: false, autoFire: 0, assist: true };
const keys = {};
let mouse = { on: false, x: 0, y: 0, down: false };
const sticks = {};
function releaseInput() { for (const k in keys) keys[k] = false; Game.mapHeld = false; mouse.down = false; F3.fireHeld = false; F3.tapFire = 0; }
function resetInput() { releaseInput(); Object.assign(inp, { mx: 0, my: 0, aiming: false, fire: false, autoFire: 0 }); for (const k in sticks) delete sticks[k]; $('stickL').style.display = $('stickR').style.display = 'none'; }
addEventListener('blur', releaseInput);
addEventListener('pointerup', e => { if (e.pointerType === 'mouse') mouse.down = false; });   // released outside the touch layer

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (Game.mode === 'mission' && !Game.paused && M && M.state === 'play' && $('modal').classList.contains('hidden')) {
    if (e.code === 'KeyR') reload(M);
    if (e.code === 'KeyQ' || e.code === 'Digit1' || e.code === 'Digit2') swapWeapon(M);
    if (e.code === 'KeyM' || e.code === 'Tab') { Game.mapHeld = true; e.preventDefault(); }
    const sk = { KeyG: 'grenade', KeyF: 'flash', KeyT: 'flare', KeyE: 'mine', KeyH: 'medkit' }[e.code];
    if (sk && f3Active(M)) {   // first person: throw at the enemy under the crosshair, else straight ahead
      const p = M.player, e = F3.target, d = (SUPPLIES[sk].range || 0) * 0.75;
      sk === 'grenade' || sk === 'flash' || sk === 'flare' ? useSupply(M, sk, e ? e.x : p.x + Math.cos(F3.yaw) * d, e ? e.y : p.y + Math.sin(F3.yaw) * d) : useSupply(M, sk);
    } else if (sk) { const p = M.player; mouse.on && (sk === 'grenade' || sk === 'flash' || sk === 'flare') ? useSupply(M, sk, p.x + mouse.x - VW / 2, p.y + mouse.y - VH / 2) : useSupply(M, sk); }
    if (e.code === 'Escape') { Game.paused = true; UI.openPanel('pause'); }
  }
});
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'KeyM' || e.code === 'Tab') Game.mapHeld = false; });

// touch twin-stick on the #touch layer
const touch = $('touch');
function stickEl(side) { return side === 'L' ? $('stickL') : $('stickR'); }
touch.addEventListener('pointerdown', e => {
  SFX.init();
  const fps = f3Active(M);
  if (e.pointerType === 'mouse') {
    F3.touch = false;
    if (fps && !F3.locked && !F3.noLock) { f3Lock(); return; }   // first click only grabs the mouse
    mouse.down = true; touch.setPointerCapture(e.pointerId); return;
  }
  F3.touch = true;
  const side = e.clientX < innerWidth * 0.45 ? 'L' : 'R';
  if (Object.values(sticks).some(s => s.side === side)) return;
  sticks[e.pointerId] = { side, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0, t0: performance.now(), moved: 0 };
  if (fps && side === 'R') { Object.assign(sticks[e.pointerId], { look: true, lx: e.clientX }); touch.setPointerCapture(e.pointerId); return; }   // first person: drag = turn (no stick)
  const el = stickEl(side); el.style.display = 'block'; el.style.left = e.clientX + 'px'; el.style.top = e.clientY + 'px'; el.firstChild.style.transform = '';
  touch.setPointerCapture(e.pointerId);
});
touch.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { mouse.on = true; const p = toCanvas(e); mouse.x = p.x; mouse.y = p.y; return; }
  const s = sticks[e.pointerId]; if (!s) return;
  if (s.look) { f3Turn(e.clientX - s.lx, F3.touchSens); s.lx = e.clientX; s.moved = Math.max(s.moved, Math.hypot(e.clientX - s.ox, e.clientY - s.oy)); return; }
  let dx = e.clientX - s.ox, dy = e.clientY - s.oy; const d = Math.hypot(dx, dy), R = 50;
  s.moved = Math.max(s.moved, d);
  if (d > R) { dx = dx / d * R; dy = dy / d * R; }
  s.dx = dx / R; s.dy = dy / R;
  stickEl(s.side).firstChild.style.transform = `translate(${dx}px,${dy}px)`;
});
function endStick(e) {
  if (e.pointerType === 'mouse') { mouse.down = false; return; }
  const s = sticks[e.pointerId]; if (!s) return;
  if (s.look) { if (performance.now() - s.t0 < 250 && s.moved < 14) F3.tapFire = 0.3; delete sticks[e.pointerId]; return; }   // quick tap = short burst straight ahead
  if (s.side === 'R' && performance.now() - s.t0 < 250 && s.moved < 14) inp.autoFire = 0.45; // quick tap = auto-aim burst
  delete sticks[e.pointerId]; stickEl(s.side).style.display = 'none';
}
touch.addEventListener('pointerup', endStick); touch.addEventListener('pointercancel', endStick);
touch.addEventListener('contextmenu', e => e.preventDefault());

$('bMap').addEventListener('pointerdown', e => { Game.mapHeld = true; e.stopPropagation(); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => $('bMap').addEventListener(ev, () => Game.mapHeld = false));
$('bPause').addEventListener('click', () => { Game.paused = true; UI.openPanel('pause'); });
$('uWeapon').addEventListener('click', () => M && swapWeapon(M));
$('bReload').addEventListener('click', () => M && reload(M));
// throw buttons (grenade, flashbang): quick tap = auto-throw at the nearest enemy in front.
// press + drag = aim: the aiming ring sits at the centre of the right half of the screen and the finger's offset from that
// centre picks direction and distance (so every direction works although the buttons are at the right edge); release = throw,
// back onto the button and release = cancel. Mine / medkit buttons: tap = use.
const nadeDrag = { id: null, el: null, kind: 'grenade', ox: 0, oy: 0, cx: 0, cy: 0, moved: 0, fx: 0, fy: 0 }, NADE_PULL = 70, NADE_TAP = 12, NADE_CANCEL = 22;
function nadeUpdate(e) {
  const d = Math.hypot(e.clientX - nadeDrag.ox, e.clientY - nadeDrag.oy), el = nadeDrag.el;
  nadeDrag.moved = Math.max(nadeDrag.moved, d);
  const dx = e.clientX - nadeDrag.cx, dy = e.clientY - nadeDrag.cy, dl = Math.hypot(dx, dy), k = dl > NADE_PULL ? NADE_PULL / dl : 1;
  nadeDrag.fx = dx / NADE_PULL; nadeDrag.fy = dy / NADE_PULL;
  const aiming = nadeDrag.moved >= NADE_TAP && d >= NADE_CANCEL;
  if (f3Active(M)) { M.nadeAim = null; return false; }   // first person: no top-down aiming ring
  if (M) M.nadeAim = aiming && supCount(nadeDrag.kind) > 0 ? Object.assign(grenadeAimTarget(M, nadeDrag.fx, nadeDrag.fy, nadeDrag.kind), { kind: nadeDrag.kind }) : null;
  el.classList.toggle('aim', aiming); el.classList.toggle('cancel', nadeDrag.moved >= NADE_TAP && !aiming);
  const ring = $('stickN'); ring.classList.toggle('off', !aiming);
  ring.firstChild.style.transform = aiming ? `translate(${dx * k}px,${dy * k}px)` : '';
  return aiming;
}
function nadeEnd(e, fire) {
  if (e.pointerId !== nadeDrag.id) return;
  const aiming = nadeUpdate(e), kind = nadeDrag.kind; nadeDrag.id = null;
  nadeDrag.el.classList.remove('aim', 'cancel'); $('stickN').style.display = 'none';
  if (!M) return;
  M.nadeAim = null;
  if (!fire) return;
  if (f3Active(M)) { const t = F3.target, p = M.player, d = SUPPLIES[kind].range * 0.75; throwGrenade(M, t ? t.x : p.x + Math.cos(F3.yaw) * d, t ? t.y : p.y + Math.sin(F3.yaw) * d, kind); return; }
  if (nadeDrag.moved < NADE_TAP) throwGrenade(M, undefined, undefined, kind);                    // quick tap
  else if (aiming) { const t = grenadeAimTarget(M, nadeDrag.fx, nadeDrag.fy, kind); throwGrenade(M, t.x, t.y, kind); }
}
['bNade', 'bFlash', 'bFlare'].forEach(id => {
  const el = $(id);
  el.addEventListener('pointerdown', e => {
    e.stopPropagation(); e.preventDefault(); SFX.init();
    if (nadeDrag.id !== null || !M) return;
    const r = cv.getBoundingClientRect();
    Object.assign(nadeDrag, { id: e.pointerId, el, kind: el.dataset.k, ox: e.clientX, oy: e.clientY, cx: r.left + r.width * 0.75, cy: r.top + r.height * 0.5, moved: 0, fx: 0, fy: 0 });
    el.setPointerCapture(e.pointerId);
    if (e.pointerType !== 'mouse' && !f3Active(M)) { const ring = $('stickN'); ring.style.display = 'block'; ring.classList.add('off'); ring.style.left = nadeDrag.cx + 'px'; ring.style.top = nadeDrag.cy + 'px'; ring.firstChild.style.transform = ''; }
  });
  el.addEventListener('pointermove', e => { if (e.pointerId === nadeDrag.id) nadeUpdate(e); });
  el.addEventListener('pointerup', e => nadeEnd(e, true));
  el.addEventListener('pointercancel', e => nadeEnd(e, false));
});
['bMine', 'bMed'].forEach(id => {
  const el = $(id);
  el.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); SFX.init(); if (M) useSupply(M, el.dataset.k); });
});

// first person: grab the mouse (pointer lock). Esc releases it -> pause.
function f3Lock() {
  try { const r = touch.requestPointerLock(); if (r && r.catch) r.catch(() => { F3.noLock = true; }); } catch (e) { F3.noLock = true; }
}
document.addEventListener('pointerlockerror', () => { F3.noLock = true; });
document.addEventListener('pointerlockchange', () => {
  F3.locked = document.pointerLockElement === touch;
  if (!F3.locked) { mouse.down = false; if (Game.mode === 'mission' && M && M.state === 'play' && !Game.paused && f3Active(M) && $('modal').classList.contains('hidden')) { Game.paused = true; UI.openPanel('pause'); } }
});
document.addEventListener('mousemove', e => { if ((F3.locked || F3.noLock) && Game.mode === 'mission' && !Game.paused && f3Active(M)) f3Turn(e.movementX || 0, F3.sens); });
// touch fire button: hold = fire, dragging it also turns
(() => {
  const el = $('bFire'); let id = null, lx = 0;
  el.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); SFX.init(); id = e.pointerId; lx = e.clientX; F3.fireHeld = true; F3.touch = e.pointerType !== 'mouse'; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => { if (e.pointerId === id) { f3Turn(e.clientX - lx, F3.touchSens); lx = e.clientX; } });
  ['pointerup', 'pointercancel'].forEach(ev => el.addEventListener(ev, e => { if (e.pointerId === id) { id = null; F3.fireHeld = false; } }));
})();

function readInput(dt) {
  if (f3Active(M)) { f3ReadInput(dt, inp, keys, sticks, mouse); return; }
  let mx = 0, my = 0, aiming = false, ang = inp.aimAng, fire = false;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (keys.KeyW || keys.ArrowUp) my -= 1; if (keys.KeyS || keys.ArrowDown) my += 1;
  for (const id in sticks) {
    const s = sticks[id];
    if (s.side === 'L') { mx += s.dx; my += s.dy; }
    else { const d = Math.hypot(s.dx, s.dy); if (d > 0.25) { aiming = true; ang = Math.atan2(s.dy, s.dx); fire = true; } }
  }
  if (!aiming && mouse.on && M) {
    const p = M.player, cam = M.cam || { x: 0, y: 0 };
    ang = Math.atan2(mouse.y + cam.y - p.y, mouse.x + cam.x - p.x); aiming = true; fire = mouse.down;
    inp.assist = false;
  } else inp.assist = true;
  inp.mx = mx; inp.my = my; inp.aiming = aiming; inp.aimAng = ang; inp.fire = fire;
  if (inp.autoFire > 0) inp.autoFire -= dt;
}

// hub / edit pointer on canvas area
let hubPtr = null;
$('app').addEventListener('pointerdown', e => {
  SFX.init();
  if (!(Game.mode === 'hub') || !$('modal').classList.contains('hidden')) return;
  if (e.target !== cv && e.target !== $('app') && !e.target.classList.contains('screen')) return;
  hubPtr = { x: e.clientX, y: e.clientY };
});
$('app').addEventListener('pointermove', e => {
  if (Game.mode !== 'hub' || !RE.on || e.pointerType !== 'mouse') return;
  const p = toCanvas(e); roomPointer(p.x, p.y, 'move');
});
$('app').addEventListener('pointerup', e => {
  if (!hubPtr) return;
  const moved = Math.hypot(e.clientX - hubPtr.x, e.clientY - hubPtr.y); hubPtr = null;
  if (moved > 12) return;
  const p = toCanvas(e); roomPointer(p.x, p.y, 'tap');
});

// buttons
function newGame() {
  window.__demo = false; S = newSave(); refreshOffers(true); saveGame(true); SFX.init(); RE.hero = null; Game.toHub();
  UI.toast('기지에 오신 것을 환영합니다! [출격]으로 첫 임무를 시작하세요', 4000);
}
$('bNew').addEventListener('click', () => { if (window.__demo) newGame(); else UI.openPanel('confirmNew'); });
$('bContinue').addEventListener('click', () => { SFX.init(); Game.toHub(); });
$('bSettings').addEventListener('click', () => UI.openPanel('settings'));
$('bEdit').addEventListener('click', () => UI.enterEdit());
$('bEditDone').addEventListener('click', () => UI.exitEdit());
$('mClose').addEventListener('click', () => UI.closeModal());
$('modal').addEventListener('click', e => { if (e.target === $('modal') && !['result', 'pause'].includes(UI.panel)) UI.closeModal(); });
$('bSelMove').addEventListener('click', () => { RE.moving = !RE.moving; RE.placeId = null; UI.refreshEdit(); });
$('bSelStore').addEventListener('click', () => {
  const o = S.room.items.find(q => q.uid === RE.sel); if (!o) return;
  storeFurniture(RE.sel); RE.sel = null; RE.moving = false; SFX.play('click'); UI.refreshEdit();
});
$('bSelDisp').addEventListener('click', () => { if (RE.sel) UI.openDisplay(RE.sel); });
$('bSelCancel').addEventListener('click', () => { RE.sel = null; RE.moving = false; UI.refreshEdit(); });

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { releaseInput(); if (Game.mode === 'mission' && M && M.state === 'play' && !Game.paused) { Game.paused = true; UI.openPanel('pause'); } SFX.suspend(true); saveGame(true); }
  else SFX.suspend(false);
});
window.__esc = () => { // Android back button
  if (!$('modal').classList.contains('hidden')) { if (UI.panel === 'pause') UI.a_resume(); else if (UI.panel !== 'result') UI.closeModal(); return; }
  if (Game.mode === 'mission') { Game.paused = true; UI.openPanel('pause'); return; }
  if (UI.screen === 'edit') { UI.exitEdit(); return; }
};

// ---------------- main loop ----------------
let last = performance.now(), clock = 0;
function frame(now) {
  requestAnimationFrame(frame);   // schedule first: an error below must not stop the loop for good
  try { frameBody(now); } catch (e) { console.error(e); }
}
function frameBody(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
  ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.imageSmoothingEnabled = false;
  if (Game.mode === 'mission' && M) {
    readInput(dt);
    if (!Game.paused && !Game.mapHeld) updateMission(M, dt, inp);
    const v3 = f3Active(M);
    if (v3) f3Render(ctx, M, clock, dt); else { f3Show(false); renderMission(ctx, M, clock); }
    if (M) {
      M.cam = { x: Math.round(M.player.x) - (VW >> 1), y: Math.round(M.player.y) - (VH >> 1) };
      if (Game.mapHeld) renderMinimap(ctx, M, clock);
      UI.updateHud(M);
    }
  } else if (S) {
    f3Show(false);
    updateRoom(dt); renderRoom(ctx, clock);
  } else {
    ctx.fillStyle = '#0b0c12'; ctx.fillRect(0, 0, VW, VH);
  }
}

// ---------------- boot ----------------
// iOS Safari: block pinch / double-tap zoom and rubber-band scrolling
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('touchmove', e => { if (!e.target.closest('.body, .drawer, textarea')) e.preventDefault(); }, { passive: false });
addEventListener('orientationchange', () => setTimeout(fitCanvas, 300));
addEventListener('pageshow', () => { fitCanvas(); SFX.suspend(false); });
// offline support when served as a PWA (service worker file present)
if (window.__PWA__ && 'serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => { });

(function boot() {
  const has = loadGame();
  if (!has) { $('bContinue').classList.add('hidden'); $('bNew').classList.remove('ghost'); S = null; }
  if (has) refreshOffers();
  // title backdrop: show a demo room if there is no save
  if (!S) { S = newSave(); window.__demo = true; }
  UI.show('title');
  requestAnimationFrame(frame);
})();

</script>
</body>
